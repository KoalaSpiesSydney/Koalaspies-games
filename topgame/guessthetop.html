<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ask the AI oracle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shrikhand&family=Karla:wght@300;400;500;700&display=swap">

<style>
:root{
  --white:#fff8e7;
  --ice:#f7e9d7;
  --mist:#e7d4b5;
  --sky:#d9a066;
  --azure:#c4753a;

  --blue:#8c4f2b;       /* retro brown-orange */
  --navy:#5a3a2e;       /* deep walnut */
  --ink:#3b2a22;        /* dark chocolate */
  --muted:#b08f6f;      /* soft tan */

  --t0:#d9822b;         /* burnt orange */
  --t1:#e4b02a;         /* mustard gold */
  --t2:#7aa37a;         /* avocado green */
  --t3:#5a3a2e;         /* walnut brown */

  --display:"Shrikhand", "Cinzel", serif;
  --body:"Karla", "Figtree", sans-serif;

  --bg-image:none;
  --arena-image:none;
  color-scheme: light;
}

*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--white);color:var(--ink);font:16px/1.5 var(--body)}
.bg{position:fixed;inset:0;z-index:0;background:var(--bg-image) center/cover no-repeat;pointer-events:none}
.bg svg{width:100%;height:100%;display:block}
.bg.has-image svg{display:none}
.page-video{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;pointer-events:none}
body.in-game .bg{display:none}
body.in-game .veil{background:linear-gradient(180deg,rgba(255,255,255,.45),rgba(255,255,255,.62))}
body.in-game .log,body.in-game .note{background:rgba(255,255,255,.82);border-radius:12px;padding:8px 12px}
body.in-game .log:empty{display:none}
.veil{position:fixed;inset:0;z-index:0;pointer-events:none;background:linear-gradient(180deg,rgba(255,255,255,.35),rgba(255,255,255,.45) 45%,rgba(255,255,255,.55))}
.wrap{position:relative;z-index:1;max-width:1000px;margin:0 auto;padding-inline:16px;padding-block:18px 56px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:22px}
.logo{font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:.14em;text-transform:uppercase;color:var(--navy);display:flex;align-items:center;gap:10px}
.eye{width:34px;height:34px;flex:none}
.hdr-right{display:flex;gap:8px;align-items:center}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;padding:5px 11px;border-radius:99px;background:rgba(255,255,255,.8);border:1px solid var(--mist);color:var(--muted)}
.pill.live{color:var(--azure)} .pill.off{color:var(--muted)}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor;box-shadow:0 0 0 3px color-mix(in srgb,currentColor 20%,transparent)}
h1,h2,h3{margin:0;text-wrap:balance}
h1{font-family:var(--display);font-weight:700;font-size:clamp(28px,5vw,46px);line-height:1.12;color:var(--navy);letter-spacing:.02em}
h2{font-family:var(--display);font-weight:700;font-size:clamp(21px,3.4vw,30px);line-height:1.2;color:var(--navy)}
h3{font-size:12px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
p{margin:0}
.muted{color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.panel{background:rgba(255,255,255,.88);border:1px solid var(--mist);border-radius:18px;padding:20px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px}
button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:10px 16px;font-weight:700;color:var(--navy);background:var(--ice)}
button:hover{filter:brightness(.97)}
button:focus-visible,input:focus-visible{outline:3px solid var(--azure);outline-offset:2px}
button:disabled{opacity:.4;cursor:not-allowed;filter:none}
.btn-main{background:var(--blue);color:#fff;font-size:17px;padding:13px 24px;box-shadow:0 6px 18px -8px rgba(21,82,168,.7)}
.btn-main:hover{background:var(--azure);filter:none}
.btn-ghost{background:rgba(255,255,255,.7);border:1.5px solid var(--sky);color:var(--blue)}
.btn-small{padding:6px 12px;font-size:14px}
input[type=text],input[type=password]{font:inherit;color:var(--ink);background:#fff;border:1.5px solid var(--sky);border-radius:12px;padding:10px 12px;width:100%;min-width:0}
input.big{font-size:20px;padding:13px 14px}
label.lbl{font-size:13px;font-weight:700;color:var(--muted);display:block;margin-bottom:6px}
.qlist{display:flex;flex-direction:column;gap:8px}
.qitem{display:flex;gap:10px;align-items:center;background:var(--ice);border-radius:12px;padding:8px 10px;text-align:left;width:100%;font-weight:600}
.qitem .txt{flex:1;min-width:0}
.qitem .count{font-size:12px;color:var(--muted);flex:none;font-weight:700}
.x{background:transparent;color:var(--muted);padding:4px 8px}
.teamrow{display:flex;gap:8px;align-items:center}
.swatch{width:14px;height:14px;border-radius:4px;flex:none}
.seg{display:inline-flex;background:var(--ice);border-radius:12px;padding:3px}
.seg button{background:transparent;padding:7px 14px;font-size:14px;color:var(--muted)}
.seg button[aria-pressed=true]{background:var(--blue);color:#fff}
.qcard{position:relative;background:rgba(255,255,255,.55);color:var(--navy);border:1px solid rgba(255,255,255,.85);border-radius:20px;padding:24px 26px;box-shadow:0 10px 30px -20px rgba(11,42,85,.45),inset 0 1px 0 rgba(255,255,255,.9);backdrop-filter:blur(10px) saturate(1.2);-webkit-backdrop-filter:blur(10px) saturate(1.2);overflow:hidden}
.qcard::after{content:"";position:absolute;right:-60px;top:-60px;width:200px;height:200px;border-radius:50%;border:1px solid rgba(47,125,225,.14);box-shadow:0 0 0 24px rgba(47,125,225,.04),0 0 0 48px rgba(47,125,225,.025);pointer-events:none}
.qcard h2{color:var(--navy);position:relative;min-height:1.3em;font-size:clamp(22px,3.6vw,32px);line-height:1.25}
.qtop{position:relative;display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:6px}
.qtopic{font-family:var(--display);font-weight:700;font-size:clamp(26px,4.4vw,40px);letter-spacing:.14em;text-transform:uppercase;color:var(--navy);
  background:linear-gradient(180deg,var(--blue),var(--navy));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.qtools{display:flex;gap:8px;align-items:center}
.qbtn{display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;padding:0;border-radius:50%;background:rgba(255,255,255,.7);border:1px solid var(--sky);color:var(--blue)}
.qbtn:hover{background:#fff;filter:none}
.caret{display:inline-block;width:.08em;height:1em;margin-left:3px;vertical-align:-.12em;background:var(--azure)}
@media (prefers-reduced-motion:no-preference){.caret{animation:blink .8s steps(1) infinite}}
@keyframes blink{50%{opacity:0}}
.qcard .eyebrow{font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-bottom:8px;position:relative}
.cover{min-height:55vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:18px}
.bigteam{font-family:var(--display);font-weight:700;font-size:clamp(32px,7vw,58px);line-height:1.05}
.orb{width:128px;height:128px}
@media (prefers-reduced-motion:no-preference){
  .orb .ring{animation:spin 8s linear infinite;transform-origin:60px 60px}
  .orb .iris{animation:pulse 1.8s ease-in-out infinite;transform-origin:60px 60px}
  .flip{animation:flip .55s cubic-bezier(.2,.8,.3,1.2)}
  .pop{animation:pop .45s ease-out}
  .bigx{animation:xhit 1.1s ease-out forwards}
  .glow{animation:glow 3s ease-in-out infinite}
  .tile{transition:transform .18s, box-shadow .18s}
}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{50%{transform:scale(.82)}}
@keyframes flip{from{transform:rotateX(90deg);opacity:0}to{transform:none;opacity:1}}
@keyframes pop{from{transform:translateY(8px) scale(.97);opacity:0}to{transform:none;opacity:1}}
@keyframes xhit{0%{transform:scale(2.2);opacity:0}15%{transform:scale(1);opacity:1}75%{opacity:1}100%{opacity:0;visibility:hidden}}
@keyframes glow{50%{opacity:.55}}
.xover{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:5}
.bigx{font-family:var(--display);font-weight:700;font-size:min(40vw,260px);color:var(--navy);text-shadow:0 0 40px rgba(47,125,225,.6);opacity:0}
.board{display:grid;grid-template-columns:1fr;gap:8px}
@media (min-width:640px){.board.two{grid-template-columns:1fr 1fr;grid-auto-flow:column}}
.bslot{display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;border-radius:14px;padding:10px 14px;min-height:62px;background:linear-gradient(135deg,var(--navy),#123e7c);border:1px solid #1d4a8a;color:#fff}
.bslot .rank{font-family:var(--display);font-weight:700;font-size:22px;color:var(--sky)}
.bslot.hidden .name{color:rgba(156,195,236,.45);letter-spacing:.3em;font-weight:800}
.bslot.shown{background:#fff;color:var(--ink);border-color:var(--sky)}
.bslot.shown .rank{color:var(--azure)}
.bslot.unclaimed{background:var(--ice);border-style:dashed}
.bslot .name{font-weight:800;font-size:18px;line-height:1.25}
.bslot .why{font-size:14px;color:var(--muted);margin-top:2px;font-weight:500}
.bslot .val{font-family:var(--display);font-weight:700;font-size:24px;font-variant-numeric:tabular-nums;min-width:40px;text-align:right;color:var(--blue)}
.bslot.hidden .val{color:rgba(156,195,236,.4)}
.who{display:inline-block;font-size:12px;font-weight:800;border-radius:6px;padding:1px 8px;color:#fff;margin-top:4px}
.scorebar{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.team{border-radius:14px;padding:12px 14px;background:rgba(255,255,255,.9);border:1px solid var(--mist);border-top:5px solid var(--c)}
.team.active{box-shadow:0 0 0 2px var(--c),0 10px 24px -14px var(--c)}
.team.out{opacity:.45}
.team .nm{font-weight:800;display:flex;justify-content:space-between;gap:6px;color:var(--navy)}
.team .pts{font-family:var(--display);font-weight:700;font-size:30px;line-height:1.1;font-variant-numeric:tabular-nums;color:var(--c)}
.strikes{display:flex;gap:4px;margin-top:4px;min-height:18px}
.strike{font-weight:800;font-size:15px;line-height:1;color:var(--mist)}
.strike.on{color:var(--navy)}
.turn{font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--c)}
.scoreline{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;font-size:17px;color:var(--ink)}
.scoreline .spts{font-weight:800;font-variant-numeric:tabular-nums}
.scoreline .sx{color:var(--navy);font-weight:800;letter-spacing:.1em}
.scoreline .turn{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.scoreline .steam.active b{text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:2px}
.scoreline .steam.out{opacity:.45}
.scoreline .sep{color:var(--muted)}
body.in-game .scoreline{background:rgba(255,255,255,.82);border-radius:12px;padding:6px 12px}
.log{font-size:14px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.log b{color:var(--ink)}
.callout{border-radius:14px;padding:14px 16px;background:var(--navy);color:#fff;border:1px solid var(--navy)}
.callout b{color:#fff}
.callout.good{background:var(--ice);color:var(--ink);border-color:var(--sky)}
.callout.good b{color:var(--blue)}
.callout .btn-ghost{background:transparent;color:inherit;border-color:currentColor}
.callout .note{color:inherit;opacity:.8}
.note{font-size:13px;color:var(--muted)}
.picklist{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.chip{background:#fff;color:var(--blue);border:1.5px solid var(--sky);border-radius:99px;padding:8px 14px;font-weight:700}
.podium{display:flex;flex-direction:column;gap:10px}
.podium .team{display:flex;justify-content:space-between;align-items:center}
.rules{font-size:14px;color:var(--muted);display:grid;gap:6px}
.rules b{color:var(--ink)}
.err{color:var(--navy);font-weight:700}
.guessrow{display:flex;gap:10px}
.guessrow input{flex:1}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;max-width:820px}
.tile{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;min-height:170px;padding:22px;border-radius:20px;background:linear-gradient(160deg,#fff 0%,var(--ice) 100%);border:1.5px solid var(--sky);color:var(--navy);text-align:center;box-shadow:0 12px 26px -18px rgba(11,42,85,.7);overflow:hidden}
.tile::before{content:"";position:absolute;inset:10px;border:1px solid var(--mist);border-radius:14px;pointer-events:none}
.tile::after{content:"";position:absolute;left:50%;top:-70px;width:140px;height:140px;margin-left:-70px;border-radius:50%;background:radial-gradient(circle,rgba(47,125,225,.18),transparent 70%)}
.tile:hover{transform:translateY(-4px);box-shadow:0 18px 30px -18px rgba(21,82,168,.9);filter:none}
.tile .hint{position:relative;font-family:var(--display);font-weight:700;font-size:clamp(24px,3.6vw,32px);letter-spacing:.08em;text-transform:uppercase;overflow-wrap:anywhere}
.hintbadge{display:inline-block;background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.35);border-radius:8px;padding:2px 10px;font-family:var(--display);font-weight:700;font-size:13px;letter-spacing:.14em;text-transform:uppercase;margin-bottom:10px;position:relative}
.qitem .hintbadge{background:var(--blue);border-color:var(--blue)}
.qcard .hintbadge{background:rgba(255,255,255,.7);color:var(--blue);border-color:var(--sky)}
.twofield{display:grid;grid-template-columns:minmax(90px,1fr) 3fr auto;gap:8px}
@media (max-width:520px){.twofield{grid-template-columns:1fr}}
/* Round timer — minimal bar fixed to the bottom of the screen */
.timer{position:fixed;left:0;right:0;bottom:0;z-index:4;display:flex;align-items:center;gap:14px;
  padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));pointer-events:none}
.tbar{flex:1;height:3px;border-radius:99px;background:rgba(11,42,85,.12);overflow:hidden}
.tfill{display:block;height:100%;border-radius:inherit;background:var(--blue);transition:width .2s linear}
.tval{font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:.08em;font-variant-numeric:tabular-nums;color:var(--navy);
  background:rgba(255,255,255,.75);padding:2px 10px;border-radius:99px;min-width:4.2ch;text-align:center}
.timer.low .tfill{background:var(--navy)}
@media (prefers-reduced-motion:no-preference){.timer.low .tval{animation:tpulse 1s ease-in-out infinite}}
@keyframes tpulse{50%{opacity:.4}}
/* Crystal balls */
.arena-video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;pointer-events:none}
.ball{z-index:1}
.arena{position:relative;width:100%;aspect-ratio:16/9;max-height:560px;border-radius:28px;overflow:hidden;
  background:var(--arena-image) center/cover no-repeat,
    radial-gradient(ellipse at 50% 115%,rgba(47,125,225,.22),transparent 60%),
    linear-gradient(180deg,#f7fbff,#e6f0fb);
  border:1.5px solid var(--mist);box-shadow:inset 0 0 60px rgba(156,195,236,.3)}
@media (max-width:700px){.arena{aspect-ratio:auto;height:500px}}
/* Crystal balls, each tinted with its own colour (--bot, set in renderChoose; list in BOT_COLORS) */
.ball{position:absolute;left:0;top:0;width:clamp(78px,11vw,118px);aspect-ratio:1;max-width:100%;padding:0;border-radius:50%;
  display:flex;align-items:center;justify-content:center;overflow:hidden;will-change:transform;--bot:#3a86c8;
  background:
    radial-gradient(circle at 30% 24%,#fff 0 6%,rgba(255,255,255,0) 16%),
    radial-gradient(ellipse at 68% 82%,rgba(255,255,255,.9) 0 5%,rgba(255,255,255,0) 18%),
    radial-gradient(circle at 50% 50%,color-mix(in srgb,var(--bot) 18%,rgba(255,255,255,.75)) 0,color-mix(in srgb,var(--bot) 38%,rgba(244,248,252,.62)) 48%,color-mix(in srgb,var(--bot) 65%,rgba(205,216,228,.72)) 76%,color-mix(in srgb,var(--bot) 85%,rgba(60,70,90,.85)) 100%);
  border:1px solid rgba(255,255,255,.95);
  box-shadow:0 0 0 1px color-mix(in srgb,var(--bot) 55%,transparent),0 20px 28px -14px rgba(40,60,90,.45),0 0 28px color-mix(in srgb,var(--bot) 35%,rgba(255,255,255,.9)),
    inset 0 -14px 22px color-mix(in srgb,var(--bot) 55%,rgba(120,138,160,.35)),inset 0 10px 18px rgba(255,255,255,.9);
  backdrop-filter:blur(3px) saturate(1.3);-webkit-backdrop-filter:blur(3px) saturate(1.3);
  cursor:pointer;touch-action:manipulation}
.ball::after{content:"";position:absolute;left:18%;right:18%;top:7%;height:26%;border-radius:50%;pointer-events:none;
  background:linear-gradient(180deg,rgba(255,255,255,.95),rgba(255,255,255,0))}
.ball:hover{filter:brightness(1.05)}
.ball .mist{position:absolute;inset:-20%;border-radius:50%;opacity:.5;pointer-events:none;
  background:conic-gradient(from 0deg,transparent 0 18%,rgba(255,255,255,.9) 26%,transparent 38%,color-mix(in srgb,var(--bot) 45%,rgba(190,205,222,.55)) 58%,transparent 70%,rgba(255,255,255,.7) 84%,transparent 92%)}
.ball .word{position:relative;z-index:1;font-family:var(--display);font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--navy);
  font-size:clamp(11px,1.5vw,15px);text-shadow:0 0 8px #fff,0 0 4px #fff,0 0 2px #fff;padding-inline:10px;text-align:center;overflow-wrap:anywhere;line-height:1.1}
.ball .word.long{font-size:clamp(9px,1.15vw,12px);letter-spacing:.03em;overflow-wrap:normal;padding-inline:6px}
.ball .beyes{position:absolute;z-index:1;left:22%;width:56%;top:18%;overflow:visible;pointer-events:none;filter:drop-shadow(0 2px 2px rgba(0,0,0,.18))}
.ball .word{margin-top:34%}
.ball .beye,.ball .bpupil{transform-box:fill-box;transform-origin:center}
.ball .bpupil{transition:transform .25s ease}
.ball:hover .bpupil{transform:scale(1.2)}
.ball.caught .beye{animation:none!important;transform:scaleY(.3)}
.ball.fade{opacity:.15;transition:opacity .4s;pointer-events:none}
.ball.caught{z-index:2;box-shadow:0 0 0 3px #fff,0 0 0 6px color-mix(in srgb,var(--bot) 50%,#c9d4e2),0 0 60px 10px rgba(255,255,255,1),0 0 90px color-mix(in srgb,var(--bot) 70%,transparent)}
@media (prefers-reduced-motion:no-preference){
  .ball .mist{animation:swirl 7s linear infinite}
  .ball .beye{animation:eyeblink 4.2s infinite;animation-delay:var(--d,0s)}
  .ball .blook{animation:eyelook 6s ease-in-out infinite;animation-delay:var(--d,0s)}
  .ball.caught{animation:catch .7s ease-out forwards}
}
@keyframes swirl{to{transform:rotate(360deg)}}
@keyframes eyeblink{0%,90%,100%{transform:scaleY(1)}93%{transform:scaleY(.1)}96%{transform:scaleY(1)}98%{transform:scaleY(.1)}}
@keyframes eyelook{0%,12%{transform:translate(0,0)}20%,34%{transform:translate(3.5px,-1.5px)}42%,56%{transform:translate(-3.5px,-1px)}64%,78%{transform:translate(1px,2.5px)}86%,100%{transform:translate(0,0)}}
@keyframes catch{40%{filter:brightness(1.35)}100%{filter:brightness(1.12)}}
/* Speed control: a small segmented switch, pushed to the right of the row */
.speedctl{margin-left:auto;display:inline-flex;align-items:center;gap:0;background:rgba(255,255,255,.7);border:1.5px solid var(--sky);border-radius:12px;padding:3px}
.speedctl .speedlbl{font-size:13px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--navy);opacity:.7;padding:0 10px 0 8px}
.speedctl button{background:transparent;border-radius:9px;padding:7px 14px;font-size:14px;color:var(--blue)}
.speedctl button[aria-pressed="true"]{background:var(--blue);color:#fff}
@media (max-width:560px){.speedctl{margin-left:0}}
@media (prefers-reduced-motion:reduce){.speedctl{display:none}}
@media (prefers-reduced-motion:reduce){.arena{aspect-ratio:auto;height:auto;display:flex;flex-wrap:wrap;gap:16px;justify-content:center;padding:20px}.ball{position:relative;transform:none!important}}
/* Intro + instructions */
.splash{min-height:72vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:20px;cursor:pointer;user-select:none}
.splash h1{font-size:clamp(40px,9vw,88px);letter-spacing:.08em;text-transform:uppercase;line-height:1}
.splash .sub{font-size:clamp(16px,2.4vw,20px);color:var(--muted);max-width:40ch}
.splash .tap{font-size:12px;font-weight:800;letter-spacing:.24em;text-transform:uppercase;color:var(--azure)}

function drawOffer(avoid){
  avoid=avoid||[];
  const fresh=shuffle(state.bank.filter(q=>!avoid.includes(q.text)));
  const rest=shuffle(state.bank.filter(q=>avoid.includes(q.text)));
  state.offer=fresh.concat(rest).slice(0,8).map(q=>q.text);
}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a}
function countFrom(text){const m=String(text).match(/\b(\d{1,2})\b/);return Math.min(8,Math.max(3,m?+m[1]:5));}

/* ---------- Guess matching ---------- */
function lev(a,b){const m=a.length,n=b.length;if(!m)return n;if(!n)return m;let prev=Array.from({length:n+1},(_,j)=>j);for(let i=1;i<=m;i++){const cur=[i];for(let j=1;j<=n;j++)cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1));prev=cur;}return prev[n];}
function close(g,t){
  if(!g||!t) return false;
  if(g===t) return true;
  if(g.length>=4 && t.length>=4 && (t.includes(g)||g.includes(t))) return true;
  const tol=t.length<=4?0:t.length<=7?1:2;
  return lev(g,t)<=tol;
}
function matchGuess(guess){
  const g=norm(guess);
  for(let i=0;i<state.board.length;i++){
    const a=state.board[i];
    if([a.name,...(a.aliases||[])].some(x=>close(g,norm(x)))) return i;
  }
  return -1;
}

/* ---------- The AI oracle ---------- */
function prompt(q,n){
  const today=new Date().toLocaleDateString("en-AU",{day:"numeric",month:"long",year:"numeric"});
  return `You are "The AI oracle" in a party game played like Family Feud. Teams try to guess the answers on YOUR board, so give your own honest best judgement from what you know (today is ${today}). Commit to one ranking — don't hedge.

Question: "${q}"

Give exactly ${n} answers ranked from #1 (top) down. For each:
- "name": short (max 4 words)
- "aliases": up to 4 other ways players might say it (nicknames, short forms, other spellings, e.g. "USA", "United States", "America")
- "points": how strongly you back this answer; integers that go down the list and add up to 100
- "reason": a punchy one-sentence reason (max 18 words) read aloud when it's revealed
Keep it family-friendly.

Reply with only JSON in this shape:
{"answers":[{"name":"...","aliases":["..."],"points":38,"reason":"..."}]}`;
}

/* Ask the AI oracle for a ranked board. Inside Claude it uses Claude directly;
   on a public website it calls your own server (ORACLE_URL), which keeps your API key secret. */
async function askBoard(q,n,signal){
  let d;
  if(sample&&sample.server){
    let r;
    try{ r=await fetch(ORACLE_URL,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({question:q,n}),signal}); }
    catch(e){ if(e&&e.name==="AbortError") throw {code:"cancelled"}; throw {code:"network"}; }
    if(r.status===429) throw {code:"rate_limited"};
    if(!r.ok) throw {code:"server"};
    d=await r.json();
  } else {
    d=await sample.json(prompt(q,n),{cache:false,signal});
  }
  let ans=(d&&Array.isArray(d.answers)?d.answers:[]).filter(a=>a&&a.name).slice(0,n).map(a=>({
    name:String(a.name), reason:String(a.reason||""),
    aliases:Array.isArray(a.aliases)?a.aliases.map(String).slice(0,6):[],
    points:Math.max(1,Math.round(Number(a.points)||0))}));
  if(ans.length<3) throw {code:"invalid_json"};
  if(ans.some(a=>!a.points||a.points<1)) ans.forEach((a,i)=>a.points=(ans.length-i)*10);
  ans.sort((a,b)=>b.points-a.points);
  return ans;
}
async function consult(){
  state.phase="consult"; state.error=null; state.board=null;
  if(!typing||typing.q!==state.q) revealQuestion();
  render();
  if(!sample){
    const d=DEMO[state.q];
    if(d){ state.demo=true; state.board=d.map(([name,aliases,points,reason])=>({name,aliases,points,reason})); setTimeout(()=>{if(state.phase==="consult"&&state.demo)startPlay();},1600); return; }
    state.demo=false;
    state.error="The AI oracle is offline, so it can only answer the built-in topics. Pick one of those, or connect the AI oracle (see ORACLE_URL at the top of the script).";
    render(); return;
  }
  state.demo=false;
  const n=countFrom(state.q);
  ctl=new AbortController();
  try{
    state.board=await askBoard(state.q,n,ctl.signal); startPlay();
  }catch(e){
    if(e&&e.code==="cancelled") return;
    if(e&&e.code==="not_granted"){ sample=null; state.error="Claude access wasn't allowed, so the AI oracle can't answer. Reload the page and allow it to play."; }
    else if(e&&e.code==="rate_limited") state.error="The AI oracle is getting too many questions right now. Wait a minute and try again.";
    else state.error="The AI oracle didn't give a usable answer. Try asking again.";
    render();
  }
}

function ac(){

  try{
    if(!SFX.ctx){const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return null;
      SFX.ctx=new AC(); SFX.master=SFX.ctx.createGain(); SFX.master.gain.value=.9; SFX.master.connect(SFX.ctx.destination);}
    if(SFX.ctx.state==="suspended") SFX.ctx.resume();
    return SFX.ctx;
  }catch(e){return null;}
}
function fileSound(name,loop){
  const f=SOUND_FILES[name]; if(!f||state.sfxOff) return null;
  try{const a=new Audio(f); a.loop=!!loop; a.volume=loop?.5:.9; const p=a.play(); if(p&&p.catch)p.catch(()=>{}); return a;}catch(e){return null;}
}
function tone(f,t,dur,{type="sine",vol=.2,attack=.01,to=null,dest=null}={}){
  const c=SFX.ctx, o=c.createOscillator(), g=c.createGain();
  o.type=type; o.frequency.setValueAtTime(f,t); if(to) o.frequency.exponentialRampToValueAtTime(to,t+dur);
  g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+attack); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g); g.connect(dest||SFX.master); o.start(t); o.stop(t+dur+.05);
}
function noise(t,dur,{vol=.2,from=400,to=3000,q=1.2}={}){
  const c=SFX.ctx, n=Math.floor(c.sampleRate*dur), buf=c.createBuffer(1,n,c.sampleRate), d=buf.getChannelData(0);
  for(let i=0;i<n;i++) d[i]=Math.random()*2-1;
  const src=c.createBufferSource(), bp=c.createBiquadFilter(), g=c.createGain();
  src.buffer=buf; bp.type="bandpass"; bp.Q.value=q; bp.frequency.setValueAtTime(from,t); bp.frequency.exponentialRampToValueAtTime(to,t+dur);
  g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+dur*.4); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  src.connect(bp); bp.connect(g); g.connect(SFX.master); src.start(t); src.stop(t+dur);
}

function humStart(){
  welcomeStart();
  if(document.getElementById("welcomeAudio")) return; // Welcome.mp3 replaces the synth "Ommm"
  if(SFX.hum||SFX.humFile) return;
  if(SOUND_FILES.hum){ SFX.humFile=fileSound("hum",true); return; }
  const c=ac(); if(!c) return;
  const out=c.createGain(); out.gain.value=0; out.connect(SFX.master);
  const lp=c.createBiquadFilter(); lp.type="lowpass"; lp.frequency.value=350; lp.Q.value=4; lp.connect(out);
  const f1=c.createBiquadFilter(); f1.type="bandpass"; f1.frequency.value=480; f1.Q.value=5;
  const f2=c.createBiquadFilter(); f2.type="bandpass"; f2.frequency.value=820; f2.Q.value=7;
  const mix=c.createGain(); mix.gain.value=1.4; f1.connect(lp); f2.connect(lp);
  const oscs=[[110,.5],[110.6,.45],[164.8,.18],[55,.25]].map(([f,v])=>{const o=c.createOscillator(),g=c.createGain();o.type="sawtooth";o.frequency.value=f;g.gain.value=v;o.connect(g);g.connect(f1);g.connect(f2);g.connect(mix);o.start();return o;});
  mix.connect(lp);
  const vib=c.createOscillator(), vg=c.createGain(); vib.frequency.value=4.5; vg.gain.value=1.2; vib.connect(vg); oscs.forEach(o=>vg.connect(o.frequency)); vib.start();
  const cycle=()=>{ const t=c.currentTime;
    out.gain.cancelScheduledValues(t); out.gain.setValueAtTime(out.gain.value,t);
    out.gain.linearRampToValueAtTime(.09,t+1.4); out.gain.setValueAtTime(.09,t+4.2); out.gain.linearRampToValueAtTime(0.0,t+6.2);
    lp.frequency.cancelScheduledValues(t); lp.frequency.setValueAtTime(350,t); lp.frequency.linearRampToValueAtTime(1200,t+1.2);
    lp.frequency.setValueAtTime(1200,t+2.8); lp.frequency.linearRampToValueAtTime(300,t+3.5); };
  cycle();
  SFX.hum={out,oscs:[...oscs,vib],timer:setInterval(cycle,7000)};
}
function humStop(){
  welcomeStop();
  if(SFX.humFile){ try{SFX.humFile.pause();}catch(e){} SFX.humFile=null; }
  const h=SFX.hum; if(!h) return; SFX.hum=null; clearInterval(h.timer);
  try{ const t=SFX.ctx.currentTime; h.out.gain.cancelScheduledValues(t); h.out.gain.setValueAtTime(h.out.gain.value,t); h.out.gain.linearRampToValueAtTime(0,t+.4); h.oscs.forEach(o=>o.stop(t+.5)); }catch(e){}
}

  const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  let W=arena.clientWidth, H=arena.clientHeight;
  const size=els[0]?els[0].offsetWidth:140;
  // start spread across the arena
  const balls=els.map((el,i)=>{
    const cols=Math.min(els.length,Math.max(2,Math.floor(W/(size*1.15))));
    const cx=((i%cols)+.5)*(W/cols), cy=(Math.floor(i/cols)+.5)*(H/Math.ceil(els.length/cols));
    const ang=Math.random()*Math.PI*2, sp=(reduce?0:1)*(95+Math.random()*70); // px per second
    return {el,x:Math.min(W-size,Math.max(0,cx-size/2)),y:Math.min(H-size,Math.max(0,cy-size/2)),vx:Math.cos(ang)*sp,vy:Math.sin(ang)*sp,wob:Math.random()*6};
  });
  const place=b=>{b.el.style.transform=`translate(${b.x}px,${b.y}px)`;};
  balls.forEach(place);
  if(reduce) return;
  let last=performance.now(), t0=last, cur=ballSpeed;
  const step=now=>{
    const dt=Math.min(.05,(now-last)/1000); last=now;
    W=arena.clientWidth; H=arena.clientHeight;
    cur+=(ballSpeed-cur)*Math.min(1,dt*4);            // glide into the chosen speed rather than jump
    if(Math.abs(ballSpeed-cur)<.002) cur=ballSpeed;
    const boost=(1+Math.min(.8,(now-t0)/20000))*cur; // they speed up slowly the longer you wait
    for(const b of balls){
      b.x+=b.vx*dt*boost; b.y+=b.vy*dt*boost + Math.sin((now/600)+b.wob)*0.25*cur;
      if(b.x<0){b.x=0;b.vx=Math.abs(b.vx);} if(b.x>W-size){b.x=W-size;b.vx=-Math.abs(b.vx);}
      if(b.y<0){b.y=0;b.vy=Math.abs(b.vy);} if(b.y>H-size){b.y=H-size;b.vy=-Math.abs(b.vy);}
    }
    for(let i=0;i<balls.length;i++)for(let j=i+1;j<balls.length;j++){
      const a=balls[i],c=balls[j],dx=c.x-a.x,dy=c.y-a.y,d=Math.hypot(dx,dy);
      if(d>0&&d<size){const nx=dx/d,ny=dy/d,ov=(size-d)/2;a.x-=nx*ov;a.y-=ny*ov;c.x+=nx*ov;c.y+=ny*ov;
        const p=(a.vx-c.vx)*nx+(a.vy-c.vy)*ny; if(p>0){a.vx-=p*nx;a.vy-=p*ny;c.vx+=p*nx;c.vy+=p*ny;}}
    }
    balls.forEach(place);
    rafId=requestAnimationFrame(step);
  };
  rafId=requestAnimationFrame(step);
}

/* ---------- THE AI ORACLE'S VOICE + TYPED QUESTION ---------- */
function canSpeak(){ return "speechSynthesis" in window && typeof SpeechSynthesisUtterance!=="undefined"; }
function pickVoice(){
  if(!canSpeak()) return null;
  const vs=speechSynthesis.getVoices(); if(!vs.length) return null;
  const female=/(female|woman|karen|catherine|natasha|samantha|victoria|serena|moira|tessa|fiona|allison|ava|susan|zira|hazel|libby|sonia|aria|jenny|google uk english female|google us english)/i;
  const en=vs.filter(v=>/^en[-_]/i.test(v.lang)||/^en$/i.test(v.lang));
  return en.find(v=>/en[-_]AU/i.test(v.lang)&&female.test(v.name))
      || en.find(v=>/en[-_]GB/i.test(v.lang)&&female.test(v.name))
      || en.find(v=>female.test(v.name))
      || en[0] || vs[0];
}
if(canSpeak()){ try{ speechSynthesis.onvoiceschanged=()=>{voicePick=pickVoice();}; voicePick=pickVoice(); }catch(e){} }
function speak(text,onDone){
  if(canSpeak()&&!state.voiceOff){ try{speechSynthesis.cancel();}catch(e){} }
  say(text,onDone);
}
/* Speak without cancelling what's already queued; onDone runs once the words finish
   (or straight away if the voice is off, with a safety timeout in case the browser never reports "finished"). */
function say(text,onDone){
  let done=false; const fin=()=>{ if(done) return; done=true; clearTimeout(fb); if(onDone) onDone(); };
  let fb=null;
  if(!canSpeak()||state.voiceOff){ fin(); return; }
  try{
    const u=new SpeechSynthesisUtterance(text);
    voicePick=voicePick||pickVoice(); if(voicePick) u.voice=voicePick;
    u.rate=.92; u.pitch=1.08; u.volume=1;
    u.onboundary=e=>{ if(typing&&typing.q===text&&e.charIndex!=null) typing.i=Math.max(typing.i,Math.min(text.length,e.charIndex)); };
    u.onend=fin; u.onerror=fin;
    fb=setTimeout(fin,2500+text.length*110);
    speechSynthesis.speak(u);
  }catch(e){ fin(); }
}
function revealQuestion(){
  const q=state.q;
  if(typing&&typing.timer) clearInterval(typing.timer);
  const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  typing={q,i:reduce?q.length:0,timer:null};
  state.questionRead=false;
  speak(q,()=>{ if(state.q!==q) return; state.questionRead=true; tryStartClock(); });
  if(reduce) return;
  typing.timer=setInterval(()=>{
    if(!typing||typing.q!==q){return;}
    typing.i++;
    const el=document.getElementById("qtext");
    if(el) el.innerHTML=typing.i<q.length?esc(q.slice(0,typing.i))+'<span class="caret"></span>':esc(q);
    if(typing.i>=q.length){clearInterval(typing.timer);typing.timer=null;}
  },58);
}

function startClock(){
  state.clockAnnounce=false;
  if(state.phase!=="play"||!state.clockWaiting) return;

  state.deadline=Date.now()+ROUND_SECONDS*1000;

/* ---------- ROUND TIMER ---------- */
function timeLeft(){ if(state.pausedLeft!=null) return state.pausedLeft; return Math.max(0,(state.deadline||0)-Date.now()); }
function fmt(ms){ const s=Math.ceil(ms/1000); return Math.floor(s/60)+":"+String(s%60).padStart(2,"0"); }
function timerHTML(){
  const ms=timeLeft(), pct=Math.max(0,Math.min(100,ms/(ROUND_SECONDS*1000)*100));
  return `<div class="timer ${ms<=30000?"low":""}" id="timer" role="timer" aria-label="Time left">
    <span class="tbar"><span class="tfill" id="tfill" style="width:${pct}%"></span></span>
    <span class="tval" id="tval">${fmt(ms)}</span></div>`;
}
setInterval(()=>{
  if(state.phase!=="play"||state.pausedLeft!=null||!state.deadline) return;
  const ms=timeLeft();
  const v=document.getElementById("tval"), f=document.getElementById("tfill"), t=document.getElementById("timer");
  if(v) v.textContent=fmt(ms);
  if(f) f.style.width=Math.max(0,ms/(ROUND_SECONDS*1000)*100)+"%";

  if(sec<=10&&sec>0&&state.lastTick!==sec){ state.lastTick=sec; sfx.tick(sec); }
  if(ms<=0){ state.deadline=null; bgMusic(false); timeUp(); }

      <div>${boardHTML(false)}</div>
      <div class="stack">
        ${state.log.length?`<div class="log"><h3>This round</h3>${state.log.slice().reverse().map(l=>`<span>${l}</span>`).join("")}</div>`:""}
        <div><button class="btn-ghost btn-small" id="giveup">Reveal the rest and end the round</button></div>
      </div>
    </div></div>`;
  app.insertAdjacentHTML("beforeend",timerHTML());
  const inp=document.getElementById("guess");
  if(inp){
    const go=()=>{const v=inp.value.trim(); if(v) doGuess(v);};
    document.getElementById("go").onclick=go;
    inp.onkeydown=e=>{if(e.key==="Enter")go();};
    if(!matchMedia("(pointer:coarse)").matches) inp.focus();
  }
  app.querySelectorAll("[data-take]").forEach(b=>b.onclick=()=>{sfx.takeover(); const i=+b.dataset.take; state.control=i; state.undo=null;
    state.lastResult={good:true,html:`<p><b style="color:${TEAM_COLORS[i]}">${esc(state.teams[i].name)}</b> take over! Keep guessing until you miss.</p>`};
    state.log.push(`<b>${esc(state.teams[i].name)}</b> took over`); render();});
  const fix=document.getElementById("fix"); if(fix) fix.onclick=()=>{document.getElementById("fixlist").hidden=false;fix.hidden=true;};
  app.querySelectorAll("[data-fix]").forEach(b=>b.onclick=()=>overrule(+b.dataset.fix));
  document.getElementById("giveup").onclick=endRound;
}

function flash(){
  sfx.wrong();
  const o=document.getElementById("xover");
  o.innerHTML=matchMedia("(prefers-reduced-motion: reduce)").matches?"":'<div class="bigx">✕</div>';
  setTimeout(()=>{o.innerHTML="";},1200);
}
function award(team,slot,guess){
  sfx.right();
  const a=state.board[slot];
  state.claimed[slot]=team; state.teams[team].score+=a.points; state.roundPts[team]+=a.points;
  state.lastResult={good:true,slot,html:`<p><b>${esc(state.teams[team].name)}</b> found <b>#${slot+1} ${esc(a.name)}</b>: +${a.points}. Keep going!</p>`};
  state.log.push(`<b>${esc(state.teams[team].name)}</b>: “${esc(guess)}” ✓ #${slot+1} +${a.points}`);
  if(state.claimed.every(c=>c!==null)){ state.lastResult.html=`<p><b>${esc(state.teams[team].name)}</b> found <b>#${slot+1} ${esc(a.name)}</b> (+${a.points}) and cleared the board!</p>`; setTimeout(()=>sfx.cleared(),650); setTimeout(endRound,1400); }
}
function doGuess(guess){
  const team=state.control, slot=matchGuess(guess);
  state.undo=null;
  if(slot>=0 && state.claimed[slot]!==null){
    sfx.blip();
    state.lastResult={good:false,html:`<p><b>${esc(state.board[slot].name)}</b> is already on the board. Guess again.</p>`};
    render(); return;
  }
  if(slot>=0){ award(team,slot,guess); render(); return; }
  // miss
  state.strikes[team]++;
  const elig=takers(team), teamOut=state.strikes[team]>=MAX_STRIKES;
  state.log.push(`<b>${esc(state.teams[team].name)}</b>: “${esc(guess)}” ✕`);
  state.undo={team,guess,prevControl:team};
  flash();
  const out=teamOut?` That's two strikes: <b>${esc(state.teams[team].name)}</b> is out this round.`:"";
  if(!elig.length){
    if(teamOut){ state.lastResult=null; render(); setTimeout(endRound,1300); return; }
    state.lastResult={good:false,canFix:true,html:`<p>“${esc(guess)}” isn't on the board. Nobody else can take over, so <b>${esc(state.teams[team].name)}</b> keep guessing.</p>`};
    render(); return;
  }
  state.control=-1; state.missTeam=team;
  state.lastResult={good:false,canFix:true,html:`<p>“${esc(guess)}” isn't on the board.${out} The board is open!</p>`};
  render();
}
function overrule(slot){
  const u=state.undo; if(!u) return;
  state.strikes[u.team]--; state.control=u.team; state.log.pop(); state.undo=null;
  award(u.team,slot,u.guess);
  state.lastResult.html=`<p>Host's call: it counts! `+state.lastResult.html.slice(3);
  render();
}

/* ---------- ROUND END / FINAL ---------- */
function endRound(){ if(state.phase!=="play") return; state.claimed=state.claimed.map(c=>c===null?-1:c); state.lastResult=null; state.phase="roundEnd"; render(); }
function renderRoundEnd(){
  const timedOut=state.timedOut; state.timedOut=false;
  const last=state.round+1>=state.totalRounds, nextChooser=(state.chooser+1)%state.teams.length;
  const left=state.claimed.filter(c=>c<0).length;
  app.innerHTML=`<div class="stack">${qHeader()}
    <div class="grid2" style="align-items:start">
      <div class="stack"><h3>The AI oracle's full board</h3>${boardHTML(true)}
        <p class="note">${timedOut?"<b>Time’s up!</b> ":""}${left?`${left} answer${left>1?"s":""} nobody found.`:"Every answer found!"} Ranked live by the AI oracle, so ask again another night and the board may change.</p></div>
      <div class="stack"><h3>Points this round</h3>
        <div class="scoreline">${state.teams.map((t,i)=>`<span class="steam"><b style="color:${TEAM_COLORS[i]}">${esc(t.name)}</b> <span class="spts">+${state.roundPts[i]}</span></span>`).join('<span class="sep" aria-hidden="true">·</span>')}</div>
        <h3>Overall</h3>${scoreBar(false)}
        <div class="row"><button class="btn-main" id="next">${last?"On to Fast Money":`Next: ${esc(state.teams[nextChooser].name)} choose`}</button></div></div>
    </div></div>`;
  document.getElementById("next").onclick=()=>{
    if(last){goFastMoney();return;}
    state.round++; state.chooser=nextChooser; drawOffer(); state.refreshUsed=false; state.phase="choose"; render();
  };
}
/* ---------- FAST MONEY (final round, like Family Feud) ----------
   The leading team writes 5 quick questions ("Name a fruit…"). The AI oracle answers each one in secret.
   Two players from the other team play: player 1 answers all 5 in 20 seconds, then player 2 (who didn't
   hear player 1) answers the same 5 in 25 seconds and can't repeat player 1's answers.
   Every point they score counts DOUBLE.
   Strict rule: the AI oracle answers — nobody may use AI, phones or the internet during the game. */
const STRICT_RULE="Strict rule: only the AI oracle answers. No asking AI, no phones, no looking it up during the game.";
const FM_TIME=[20,25];   // seconds for player 1 and player 2
const FM_QS=5;           // questions in Fast Money
function strictHTML(){ return `<div class="callout" style="border-width:2px"><p><b>${esc(STRICT_RULE)}</b></p></div>`; }
function matchIn(board,guess){
  const g=norm(guess); if(!g) return -1;
  for(let i=0;i<board.length;i++){ const a=board[i]; if([a.name,...(a.aliases||[])].some(x=>close(g,norm(x)))) return i; }
  return -1;
}
function goFastMoney(){
  const order=state.teams.map((t,i)=>({i,s:t.score})).sort((a,b)=>b.s-a.s);
  const tie=order.length>1&&order[0].s===order[1].s;
  state.fm={writer:tie?null:order[0].i, team:tie?null:order[order.length-1].i,
    qs:Array(FM_QS).fill(""), boards:null, err:"", turn:0, idx:0, running:false, deadline:0,
    ans:[Array(FM_QS).fill(null),Array(FM_QS).fill(null)], shown:0, msg:""};
  state.phase="fmWrite"; render();
}
function fmNames(){ const f=state.fm; return {W:state.teams[f.writer], T:state.teams[f.team]}; }
function renderFmWrite(){
  const f=state.fm;
  if(f.writer==null){
    app.innerHTML=`<div class="stack">${scoreBar(false)}
      <div class="panel stack" style="gap:12px"><p class="pill" style="align-self:start">Fast Money</p>
        <h1>It’s a tie!</h1><p class="muted">Which team writes the Fast Money questions? The other team plays them.</p>
        <div class="row">${state.teams.map((t,i)=>`<button class="btn-main" data-writer="${i}" style="background:${TEAM_COLORS[i]};color:#fff">${esc(t.name)}</button>`).join("")}</div></div></div>`;
    app.querySelectorAll("[data-writer]").forEach(x=>x.onclick=()=>{ const w=+x.dataset.writer; f.writer=w;
      f.team=state.teams.map((t,i)=>({i,s:t.score})).filter(o=>o.i!==w).sort((p,q)=>p.s-q.s)[0].i; render(); });
    return;
  }
  const {W,T}=fmNames();
  if(!sample){
    app.innerHTML=`<div class="stack">${scoreBar(false)}<div class="panel stack" style="gap:12px">
      <p class="pill" style="align-self:start">Fast Money</p><h1>Fast Money needs the AI oracle</h1>
      <p class="muted">The AI oracle is offline here, so it can’t answer new questions. Connect it (see ORACLE_URL at the top of the script) to play Fast Money.</p>
      <div class="row"><button class="btn-main" id="fmskip">Go to final scores</button></div></div></div>`;
    document.getElementById("fmskip").onclick=()=>{state.phase="final";render();};
    return;
  }
  app.innerHTML=`<div class="stack">${scoreBar(false)}
    <div class="panel stack" style="gap:14px"><p class="pill" style="align-self:start">Fast Money</p>
      <h1><span style="color:${TEAM_COLORS[f.writer]}">${esc(W.name)}</span>, write 5 quick questions</h1>
      <p class="muted">The AI oracle answers them in secret. Then two players from the <b style="color:${TEAM_COLORS[f.team]}">${esc(T.name)}</b> race the clock,
        and every point they score counts <b>double</b>. Keep them short, like “Name a fruit you peel” or “Name something people do on a Sunday”.</p>
      ${strictHTML()}
      <div class="stack" style="gap:8px">${f.qs.map((q,k)=>`<div class="row" style="flex-wrap:nowrap;align-items:center;gap:10px"><b style="width:22px">${k+1}</b>
        <input type="text" id="fmq${k}" class="fmq" data-k="${k}" autocomplete="off" placeholder="Name something…" value="${esc(q)}"></div>`).join("")}</div>
      ${f.err?`<p class="err">${esc(f.err)}</p>`:""}
      <div class="row"><button class="btn-main" id="fmgo">Send to the AI oracle</button></div></div></div>`;
  app.querySelectorAll(".fmq").forEach(x=>x.oninput=()=>{ f.qs[+x.dataset.k]=x.value; });
  const first=document.getElementById("fmq0"); if(first&&!f.qs[0]) first.focus();
  document.getElementById("fmgo").onclick=()=>{
    f.qs=f.qs.map(q=>q.trim());
    if(f.qs.some(q=>q.length<5)){ f.err="Write all 5 questions first."; render(); return; }
    f.err=""; fmConsult();
  };
}
async function fmConsult(){
  const f=state.fm; state.phase="fmConsult"; f.err=""; render();
  ctl=new AbortController();
  try{
    f.boards=await Promise.all(f.qs.map(q=>askBoard(q,5,ctl.signal)));
    f.turn=0; f.idx=0; f.running=false; state.phase="fmPlay"; render();
  }catch(e){
    if(e&&e.code==="cancelled") return;
    f.err=e&&e.code==="rate_limited"?"The AI oracle is busy. Wait a minute and try again.":
          e&&e.code==="not_granted"?"Claude access wasn't allowed, so the AI oracle can't answer. Reload the page and allow it.":
          "The AI oracle couldn’t answer those questions. Try again, or change a question.";
    render();
  }
}
function renderFmConsult(){
  const f=state.fm;
  app.innerHTML=`<div class="stack"><div class="cover">
    ${f.err?`<p class="err">${esc(f.err)}</p><div class="row"><button class="btn-main" id="fmretry">Ask again</button><button class="btn-ghost" id="fmedit">Change the questions</button></div>`:
    `<h2>The AI oracle is answering your 5 questions…</h2><p class="muted">This usually takes 10–40 seconds.</p>
     <button class="btn-ghost" id="fmedit">Cancel and change the questions</button>`}</div></div>`;
  const r=document.getElementById("fmretry"); if(r) r.onclick=fmConsult;
  document.getElementById("fmedit").onclick=()=>{ctl?.abort(); state.phase="fmWrite"; render();};
}
/* one player's run: questions one at a time against the clock */
function fmLeft(){ return Math.max(0,state.fm.deadline-Date.now()); }
function renderFmPlay(){
  const f=state.fm, {T}=fmNames(), secs=FM_TIME[f.turn];
  if(!f.running){
    app.innerHTML=`<div class="stack">${scoreBar(false)}<div class="panel stack" style="gap:14px">
      <p class="pill" style="align-self:start">Fast Money · Player ${f.turn+1} of 2</p>
      <h1><span style="color:${TEAM_COLORS[f.team]}">${esc(T.name)}</span>, player ${f.turn+1}: you have ${secs} seconds</h1>
      <p class="muted">${f.turn===0?`Player 2 leaves the room or puts on headphones now. `:`Player 1’s answers stay hidden. If you repeat one, you’ll hear a buzz: give another answer. `}
        Answer each question out loud and type it in. Stuck? Press <b>Pass</b> and come back if there’s time.</p>
      ${strictHTML()}
      <div class="row"><button class="btn-main" id="fmstart">Start the clock</button></div></div></div>`;
    document.getElementById("fmstart").onclick=()=>{ f.running=true; f.idx=0; f.msg=""; f.passes=[];
      f.deadline=Date.now()+secs*1000; fmMusic(true); render(); };
    return;
  }
  const q=f.qs[f.idx];
  app.innerHTML=`<div class="stack">${scoreBar(false)}
    <div class="panel stack" style="gap:14px">
      <div class="row" style="justify-content:space-between;align-items:center"><p class="pill" style="margin:0">Fast Money · Player ${f.turn+1} · Question ${f.idx+1} of ${FM_QS}</p>
        <span class="bigteam" id="fmclock" style="font-size:clamp(36px,6vw,56px);color:${TEAM_COLORS[f.team]}">${Math.ceil(fmLeft()/1000)}</span></div>
      <h1 style="margin:0">${esc(q)}</h1>
      <div class="guessrow"><input class="big" type="text" id="fmans" autocomplete="off" placeholder="Type the answer"><button class="btn-main" id="fmok">Answer</button><button class="btn-ghost" id="fmpass">Pass</button></div>
      ${f.msg?`<p class="err pop">${esc(f.msg)}</p>`:""}
    </div></div>`;
  const inp=document.getElementById("fmans"); inp.focus();
  const submit=()=>{ const v=inp.value.trim(); if(!v) return;
    const slot=matchIn(f.boards[f.idx],v);
    if(f.turn===1&&f.ans[0][f.idx]&&slot>=0&&f.ans[0][f.idx].slot===slot){ sfx.wrong(); f.msg="Duplicate answer! Try again."; render(); return; }
    f.ans[f.turn][f.idx]={text:v,slot,pts:slot>=0?f.boards[f.idx][slot].points:0}; sfx.blip(); f.msg=""; fmNext(); };
  document.getElementById("fmok").onclick=submit;
  inp.onkeydown=e=>{ if(e.key==="Enter") submit(); };
  document.getElementById("fmpass").onclick=()=>{ f.msg=""; fmNext(true); };
  if(canSpeak()&&!state.voiceOff){ try{speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(q); if(voicePick) u.voice=voicePick; u.rate=1.1; speechSynthesis.speak(u);}catch(e){} }
}
function fmNext(passed){
  const f=state.fm;
  // move to the next unanswered question (passed ones come back round while time is left)
  for(let step=1;step<=FM_QS;step++){ const k=(f.idx+step)%FM_QS; if(!f.ans[f.turn][k]){ if(k===f.idx&&!passed) break; f.idx=k; render(); return; } }
  fmEndTurn();
}
function fmEndTurn(){
  const f=state.fm; if(!f.running) return;
  f.running=false; fmMusic(false); try{speechSynthesis.cancel();}catch(e){}
  for(let k=0;k<FM_QS;k++) if(!f.ans[f.turn][k]) f.ans[f.turn][k]={text:"",slot:-1,pts:0};
  if(f.turn===0){ sfx.timeup(); f.turn=1; f.idx=0; render(); }
  else { sfx.timeup(); f.shown=0; state.phase="fmReveal"; render(); }
}
setInterval(()=>{ const f=state.fm; if(state.phase!=="fmPlay"||!f||!f.running) return;
  const ms=fmLeft(), el=document.getElementById("fmclock"); if(el) el.textContent=Math.ceil(ms/1000);
  const sec=Math.ceil(ms/1000); if(sec<=5&&sec>0&&f.lastTick!==sec){ f.lastTick=sec; sfx.tick(sec); }
  if(ms<=0) fmEndTurn(); },200);
function fmMusic(on){ const a=document.getElementById("bgAudio"); if(!a) return;
  if(on&&!state.sfxOff){ try{a.currentTime=0;}catch(e){} a.play().catch(()=>{}); } else { try{a.pause();}catch(e){} } }
function renderFmReveal(){
  const f=state.fm, {T}=fmNames(), total=f.shown;   // f.shown = how many answers revealed (0..10)
  const cell=(p,k)=>{ const n=p*FM_QS+k, a=f.ans[p][k];
    if(n>=f.shown) return `<td class="muted">? ? ?</td><td></td>`;
    return `<td>${a.text?esc(a.text):'<span class="muted">(no answer)</span>'}${a.slot>=0?` <span class="note">#${a.slot+1}</span>`:""}</td><td style="text-align:right;font-variant-numeric:tabular-nums"><b>${a.pts}</b></td>`; };
  let sum=0; for(let n=0;n<f.shown;n++){ const p=Math.floor(n/FM_QS), k=n%FM_QS; sum+=f.ans[p][k].pts; }
  const done=f.shown>=FM_QS*2;
  app.innerHTML=`<div class="stack">${scoreBar(false)}
    <div class="panel stack" style="gap:12px"><p class="pill" style="align-self:start">Fast Money · The AI oracle reveals</p>
      <div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse" class="fmtable">
        <thead><tr><th style="text-align:left">Question</th><th style="text-align:left">Player 1</th><th></th><th style="text-align:left">Player 2</th><th></th></tr></thead>
        <tbody>${f.qs.map((q,k)=>`<tr><td>${esc(q)}</td>${cell(0,k)}${cell(1,k)}</tr>`).join("")}</tbody></table></div>
      <p style="margin:0;font-size:20px">Fast Money points: <b>${sum}</b> × 2 = <b style="color:${TEAM_COLORS[f.team]}">${sum*2}</b> for the ${esc(T.name)}</p>
      ${done?`<details><summary>See the AI oracle’s top 5 for each question</summary>${f.qs.map((q,k)=>`<p style="margin:8px 0 0"><b>${esc(q)}</b><br>${f.boards[k].map((a,i)=>`${i+1}. ${esc(a.name)} (${a.points})`).join(" · ")}</p>`).join("")}</details>`:""}
      <div class="row">${done?`<button class="btn-main" id="fmfinal">Final scores</button>`:`<button class="btn-main" id="fmshow">Reveal the next answer</button><button class="btn-ghost" id="fmall">Reveal all</button>`}</div>
    </div></div>`;
  const step=()=>{ const n=f.shown, p=Math.floor(n/FM_QS), k=n%FM_QS; (f.ans[p][k].pts>0?sfx.right:sfx.wrong)(); f.shown++; render(); };
  const sh=document.getElementById("fmshow"); if(sh) sh.onclick=step;
  const al=document.getElementById("fmall"); if(al) al.onclick=()=>{ f.shown=FM_QS*2; sfx.cleared(); render(); };
  const fin=document.getElementById("fmfinal"); if(fin) fin.onclick=()=>{
    if(!f.scored){ f.scored=true; let s=0; f.ans.forEach(r=>r.forEach(a=>s+=a.pts)); state.teams[f.team].score+=s*2; }
    state.phase="final"; render(); };
}

function renderFinal(){
  sfx.cleared();
  const order=state.teams.map((t,i)=>({...t,i})).sort((a,b)=>b.score-a.score);
  const top=order[0], tie=order.filter(t=>t.score===top.score).length>1;
  app.innerHTML=`<div class="stack"><div class="cover" style="min-height:auto;padding-block:20px">
    <p class="pill">Game over</p>
    <div class="bigteam pop" style="color:${tie?"var(--azure)":TEAM_COLORS[top.i]}">${tie?"It's a tie!":esc(top.name)+" win!"}</div>
    <p class="muted">${tie?"The AI oracle refuses to pick a favourite.":"They think most like the machine."}</p></div>
    <div class="podium">${order.map((t,k)=>`<div class="team" style="--c:${TEAM_COLORS[t.i]}"><span class="nm">${k+1}. ${esc(t.name)}</span><span class="pts">${t.score}</span></div>`).join("")}</div>
    <div class="row"><button class="btn-main" id="again">New game</button></div></div>`;
  document.getElementById("again").onclick=()=>{const teams=state.teams.map(t=>({name:t.name,score:0})); state=freshState(); state.teams=teams; state.phase="rules"; render();};
}

const start=()=>{ if(state.phase==="consult" && !state.board){ state.phase="choose"; } render(); };
if(window.claude?.hot?.ready) window.claude.hot.ready(start); else start();
})();
</script>

</body>
</html>
