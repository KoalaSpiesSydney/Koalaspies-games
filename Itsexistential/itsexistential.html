<!doctype html>
<!-- It’s Existential! © Koala Spies Sydney. All rights reserved. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>It’s Existential! | Koala Spies Sydney</title>
<meta name="author" content="Koala Spies Sydney">
<meta name="copyright" content="© Koala Spies Sydney. All rights reserved.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800;900&display=swap">
<style>
:root{
--display:"Figtree",system-ui,sans-serif; --body:"Figtree",system-ui,sans-serif;
/* Colours: charcoal text, dark blue + gold highlights. Change them here. */
--white:#ffffff; --ice:#f7f5ef; --mist:#ebe3cd; --sky:#dcc68a; --azure:#c9982f;
--blue:#14306b; --navy:#1d1f24; --ink:#1d1f24; --muted:#5a5f6a;
--gold:#d4a72c; --gold-deep:#8a640c; --gold-pale:#f2d47a;
--mango:#f7f3e8;
--t0:#14306b; --t1:#a8770c; --t2:#4a78c8; --t3:#6b4a12;
--glow:0 0 22px rgba(212,167,44,.45);
--lift:0 12px 26px -14px rgba(20,48,107,.65);

}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:#fffaf2;color:var(--ink);font:16px/1.5 var(--body)}
[hidden]{display:none!important}
.bg{position:fixed;inset:0;z-index:0;background:var(--bg-image) center/cover no-repeat;pointer-events:none}
.bg svg{width:100%;height:100%;display:block}
.bg.has-image svg{display:none}
.page-video{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;pointer-events:none}
body.in-game .bg{display:none}
body.in-game .veil{background:linear-gradient(180deg,rgba(255,249,238,.45),rgba(255,255,255,.62))}
.veil{position:fixed;inset:0;z-index:0;pointer-events:none;background:linear-gradient(180deg,rgba(255,249,238,.70),rgba(255,255,255,.86) 45%,rgba(255,255,255,.93))}
.wrap{position:relative;z-index:1;max-width:1000px;margin:0 auto;padding-inline:16px;padding-block:18px 56px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:22px}
.logo{font-family:var(--display);font-weight:700;font-size:20px;letter-spacing:.14em;text-transform:uppercase;color:var(--navy);display:flex;align-items:center;gap:10px}
.eye{width:34px;height:34px;flex:none}
.hdr-right{display:flex;gap:8px;align-items:center}
h1,h2,h3{margin:0;text-wrap:balance}
h1{font-family:var(--display);font-weight:700;font-size:clamp(28px,5vw,46px);line-height:1.12;color:var(--navy);letter-spacing:.02em}
h2{font-family:var(--display);font-weight:700;font-size:clamp(21px,3.4vw,30px);line-height:1.2;color:var(--navy)}
h3{font-size:12px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
p{margin:0}
.muted{color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.panel{background:rgba(255,255,255,.9);border:1px solid var(--mist);border-radius:18px;padding:20px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px}
button{font:inherit;cursor:pointer;border:0;border-radius:4px;padding:10px 16px;font-weight:700;color:var(--navy);background:var(--ice)}
button:hover{filter:brightness(.97)}
button:focus-visible,input:focus-visible{outline:3px solid var(--azure);outline-offset:2px}
button:disabled{opacity:.4;cursor:not-allowed;filter:none}
.btn-main{background:var(--blue);color:#fff;font-size:17px;padding:13px 24px;box-shadow:var(--lift),var(--glow)}
.btn-main:hover{background:var(--navy);filter:none}
.btn-ghost{background:rgba(255,255,255,.7);border:1.5px solid var(--sky);color:var(--blue)}
.btn-small{padding:6px 12px;font-size:14px}
input[type=text]{font:inherit;color:var(--ink);background:#fff;border:1.5px solid var(--sky);border-radius:12px;padding:10px 12px;width:100%;min-width:0}
.x{background:transparent;color:var(--muted);padding:4px 8px}
.swatch{width:14px;height:14px;border-radius:4px;flex:none}
.seg{display:inline-flex;background:var(--ice);border-radius:5px;padding:3px;flex-wrap:wrap}
.seg button{background:transparent;padding:9px 16px;font-size:15px;color:var(--muted)}
.seg button[aria-pressed=true]{background:var(--blue);color:#fff}
.seg button.no[aria-pressed=true]{background:var(--navy)}
.note{font-size:13px;color:var(--muted)}

/* Quote card */
.qcard{position:relative;background:rgba(255,255,255,.62);color:var(--navy);border:1px solid rgba(255,255,255,.85);border-radius:20px;padding:24px 26px;box-shadow:0 10px 30px -20px rgba(90,42,12,.45),inset 0 1px 0 rgba(255,255,255,.9);backdrop-filter:blur(10px) saturate(1.2);-webkit-backdrop-filter:blur(10px) saturate(1.2);overflow:hidden}
.qcard::after{content:"";position:absolute;right:-60px;top:-60px;width:200px;height:200px;border-radius:50%;border:1px solid rgba(232,120,42,.14);box-shadow:0 0 0 24px rgba(232,120,42,.04),0 0 0 48px rgba(232,120,42,.025);pointer-events:none}
.qcard h2{position:relative;min-height:1.3em;font-size:clamp(22px,3.6vw,32px);line-height:1.3}
.qtop{position:relative;display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:6px}
.qtopic{font-family:var(--display);font-weight:700;font-size:clamp(26px,4.4vw,40px);letter-spacing:.14em;text-transform:uppercase;
  background:linear-gradient(180deg,var(--blue),var(--navy));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.qbtn{display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;padding:0;border-radius:50%;background:rgba(255,255,255,.7);border:1px solid var(--sky);color:var(--blue)}
.qbtn:hover{background:#fff;filter:none}
.qcard .eyebrow{font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-bottom:8px;position:relative}
.caret{position:relative;display:inline-block;width:0;height:1em;vertical-align:-.12em}
.caret::after{content:"";position:absolute;left:2px;top:0;width:.1em;height:1em;background:var(--azure)}
.untyped{visibility:hidden}
/* Centred quote card: name and quote sit in the middle, the read-aloud button stays top right */
.qcard{text-align:center}
.qcard h2{text-wrap:balance}
.qcard .qtop{justify-content:center;padding-inline:46px}
.qcard .qtop .qbtn{position:absolute;right:0;top:50%;transform:translateY(-50%)}
.task{font-size:17px;font-weight:600;color:var(--navy)}

.cover{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px}
.bigteam{font-family:var(--display);font-weight:700;font-size:clamp(32px,7vw,58px);line-height:1.05}
.orb{width:110px;height:110px}

@media (prefers-reduced-motion:no-preference){
  .caret{animation:blink .8s steps(1) infinite}
  .orb .ring{animation:spin 8s linear infinite;transform-origin:60px 60px}
  .orb .iris{animation:pulse 1.8s ease-in-out infinite;transform-origin:60px 60px}
  .pop{animation:pop .45s ease-out}
  .glow{animation:glow 3s ease-in-out infinite}
  .tier.hit{animation:tierhit .5s ease-out}
}
@keyframes blink{50%{opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{50%{transform:scale(.82)}}
@keyframes pop{from{transform:translateY(8px) scale(.97);opacity:0}to{transform:none;opacity:1}}
@keyframes glow{50%{opacity:.55}}
@keyframes tierhit{0%{transform:scale(1.25)}100%{transform:none}}

/* Scoreboard */
.scorebar{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.team{border-radius:14px;padding:12px 14px;background:rgba(255,255,255,.92);border:1px solid var(--mist);border-top:5px solid var(--c)}
.team.active{box-shadow:0 0 0 2px var(--c),0 10px 24px -14px var(--c)}
.team .nm{font-weight:800;display:flex;justify-content:space-between;gap:6px;color:var(--navy)}
.team .pts{font-family:var(--display);font-weight:700;font-size:30px;line-height:1.1;font-variant-numeric:tabular-nums;color:var(--c)}
.team .stash{font-size:12px;font-weight:700;color:var(--muted)}
.turn{font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--c)}

/* Talk clock */
.clock{position:relative;width:min(240px,64vw);aspect-ratio:1;margin:0 auto}
.clock svg{width:100%;height:100%;display:block}
.clock .track{fill:rgba(255,255,255,.9);stroke:var(--mist);stroke-width:8}
.clock .prog{fill:none;stroke:var(--blue);stroke-width:8;stroke-linecap:round}
.clock .mark{stroke:var(--navy);stroke-width:2.5;stroke-linecap:round}
.clock-num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.clock-num span{font-family:var(--display);font-weight:700;font-size:clamp(54px,11vw,80px);line-height:1;color:var(--navy);font-variant-numeric:tabular-nums}
.clock-num small{font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.tiers{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.tier{display:flex;flex-direction:column;align-items:center;min-width:86px;padding:8px 12px;border-radius:14px;border:1.5px solid var(--sky);background:rgba(255,255,255,.85);color:var(--muted);font-weight:700;font-size:13px}
.tier b{font-family:var(--display);font-size:20px;color:var(--blue);line-height:1.2}
.tier.hit{background:var(--blue);border-color:var(--blue);color:#fff}
.tier.hit b{color:#fff}
.result{font-family:var(--display);font-weight:700;font-size:clamp(28px,5vw,40px);color:var(--navy);line-height:1.1}

/* Bonus givers */
.giver{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--ice);border-radius:12px;padding:8px 12px;border-left:5px solid var(--c)}
.giver .who{font-weight:800;color:var(--navy)}
.giver .left{font-size:12px;color:var(--muted);font-weight:700}
.stepper{display:flex;align-items:center;gap:8px}
.stepper button{width:38px;height:38px;padding:0;border-radius:50%;background:#fff;border:1.5px solid var(--sky);color:var(--blue);font-size:20px;line-height:1}
.stepper .n{min-width:2ch;text-align:center;font-family:var(--display);font-weight:700;font-size:22px;color:var(--navy)}

/* Final table */
.tbl{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.tbl th{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);text-align:right;padding:8px 10px;border-bottom:1.5px solid var(--mist)}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl td{padding:10px;text-align:right;border-bottom:1px solid var(--mist);font-weight:600}
.tbl td.fin{font-family:var(--display);font-weight:700;font-size:22px;color:var(--blue)}
.tbl td.neg{color:var(--navy)}
.tblwrap{overflow-x:auto}

/* Crystal balls */
.arena-video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;pointer-events:none}
.arena{position:relative;width:100%;aspect-ratio:16/9;max-height:560px;border-radius:28px;overflow:hidden;
  background:var(--arena-image) center/cover no-repeat,
    radial-gradient(ellipse at 50% 115%,rgba(232,120,42,.22),transparent 60%),
    linear-gradient(180deg,#fff9f0,#ffe7c4);
  border:1.5px solid var(--mist);box-shadow:inset 0 0 60px rgba(246,198,138,.3)}
@media (max-width:700px){.arena{aspect-ratio:auto;height:500px}}
.ball{position:absolute;left:0;top:0;z-index:1;width:clamp(78px,11vw,118px);aspect-ratio:1;max-width:100%;padding:0;border-radius:50%;
  display:flex;align-items:center;justify-content:center;overflow:hidden;will-change:transform;
  background:
    radial-gradient(circle at 30% 24%,#fff 0 6%,rgba(255,255,255,0) 16%),
    radial-gradient(ellipse at 68% 82%,rgba(255,255,255,.9) 0 5%,rgba(255,255,255,0) 18%),
    radial-gradient(circle at 50% 50%,rgba(255,255,255,.72) 0,rgba(255,248,236,.62) 48%,rgba(248,222,186,.72) 76%,rgba(222,168,104,.85) 100%);
  border:1px solid rgba(255,255,255,.95);
  box-shadow:0 0 0 1px rgba(232,190,140,.55),0 20px 28px -14px rgba(110,60,15,.45),0 0 28px rgba(255,255,255,.9),
    inset 0 -14px 22px rgba(196,128,60,.35),inset 0 10px 18px rgba(255,255,255,.9);
  backdrop-filter:blur(3px) saturate(1.3);-webkit-backdrop-filter:blur(3px) saturate(1.3);
  cursor:pointer;touch-action:manipulation}
.ball::after{content:"";position:absolute;left:18%;right:18%;top:7%;height:26%;border-radius:50%;pointer-events:none;
  background:linear-gradient(180deg,rgba(255,255,255,.95),rgba(255,255,255,0))}
.ball:hover{filter:brightness(1.05)}
.ball .mist{position:absolute;inset:-20%;border-radius:50%;opacity:.5;pointer-events:none;
  background:conic-gradient(from 0deg,transparent 0 18%,rgba(255,255,255,.9) 26%,transparent 38%,rgba(250,208,150,.55) 58%,transparent 70%,rgba(255,255,255,.7) 84%,transparent 92%)}
.ball .word{position:relative;z-index:1;font-family:var(--display);font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--navy);
  font-size:clamp(11px,1.5vw,15px);text-shadow:0 0 8px #fff,0 0 2px #fff;padding-inline:10px;text-align:center;overflow-wrap:anywhere;line-height:1.1}
.ball .word.long{font-size:clamp(9px,1.15vw,12px);letter-spacing:.03em;overflow-wrap:normal;padding-inline:6px}
.ball .word.xlong{font-size:clamp(8px,.95vw,10px);letter-spacing:0}
.ball.fade{opacity:.15;transition:opacity .4s;pointer-events:none}
.ball.caught{z-index:2;box-shadow:0 0 0 3px #fff,0 0 0 6px #f2cfa0,0 0 60px 10px rgba(255,255,255,1),0 0 90px rgba(212,167,44,.75)}
@media (prefers-reduced-motion:no-preference){
  .ball .mist{animation:swirl 7s linear infinite}
  .ball.caught{animation:catch .7s ease-out forwards}
}
@keyframes swirl{to{transform:rotate(360deg)}}
@keyframes catch{40%{filter:brightness(1.35)}100%{filter:brightness(1.12)}}
@media (prefers-reduced-motion:reduce){.arena{aspect-ratio:auto;height:auto;display:flex;flex-wrap:wrap;gap:16px;justify-content:center;padding:20px}.ball{position:relative;transform:none!important}}

/* Intro */
.rulecard{max-width:680px;margin:0 auto;background:rgba(255,255,255,.95);border:1.5px solid var(--sky);border-radius:24px;padding:clamp(22px,4vw,36px);box-shadow:0 30px 60px -30px rgba(90,42,12,.55);display:flex;flex-direction:column;gap:18px}
.rulecard h1{text-align:center;text-transform:uppercase;letter-spacing:.06em;font-size:clamp(30px,6vw,52px)}
.rulecard .sub{text-align:center;color:var(--muted);font-size:17px}
.players{display:flex;flex-direction:column;gap:8px}
.prow{display:flex;gap:8px;align-items:center}
.ball.deco{position:relative;margin:0 auto;width:112px;cursor:default;pointer-events:none}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px;counter-reset:s}
.steps li{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start;counter-increment:s}
.steps li::before{content:counter(s,upper-roman);font-family:var(--display);font-weight:700;color:var(--azure);border:1.5px solid var(--sky);border-radius:50%;width:34px;height:34px;display:flex;align-items:center;justify-content:center;font-size:13px}
.steps b{color:var(--navy)}
.meander{height:14px;background:
  linear-gradient(90deg,var(--sky) 2px,transparent 2px) 0 0/14px 14px,
  linear-gradient(0deg,var(--sky) 2px,transparent 2px) 0 0/14px 14px;opacity:.5;border-radius:2px}

/* Minimal look: no card boxes */
.panel,.qcard,.rulecard{background:transparent;border:0;box-shadow:none;backdrop-filter:none;-webkit-backdrop-filter:none;border-radius:0}
.panel,.rulecard{padding:0}
.qcard{padding:8px 0 0}
.qcard::after{display:none}
.team{background:transparent;border:0;border-radius:0;padding:4px 0 0}
.team.active{box-shadow:none}
.giver{background:transparent;border-radius:0;padding:6px 0;border-left:0}
.clock .track{fill:transparent}
.tbl td,.tbl th{padding-inline:4px}
.tblwrap.panel{padding:0}
.seg{background:transparent;border:1.5px solid var(--mist)}
.qbtn,.btn-ghost{background:transparent}
.stack>.seg,.seg{align-self:flex-start}
.stack>.scorebar{margin-top:4px}
.stack>.muted+.scorebar{margin-top:-8px}
.tier{background:transparent;border:0;padding:4px 10px;opacity:.45}
.tier.hit{background:transparent;border:0;opacity:1;color:var(--blue)}
.tier.hit b{color:var(--blue)}

/* Judge screen hierarchy */
.judge{max-width:620px;margin:24px auto 0;display:flex;flex-direction:column;gap:30px}
.qmini{text-align:center}
.qmini-who{font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.qmini-q{margin-top:6px;font-size:17px;font-weight:600;color:var(--muted);font-style:italic}
.hero{text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px}
.hero-label{font-size:16px;font-weight:700;color:var(--muted)}
.hero-big{font-family:var(--display);font-weight:800;font-size:clamp(44px,9vw,72px);line-height:1;color:var(--navy);letter-spacing:-.01em}
.hero-pts{margin-top:6px;display:inline-block;background:var(--blue);color:#fff;font-weight:800;font-size:15px;border-radius:99px;padding:5px 16px}
.linkbtn{background:transparent;padding:6px 8px;font-size:13px;font-weight:700;color:var(--muted)}
.linkbtn:hover{color:var(--blue);filter:none}
.step{display:flex;flex-direction:column;gap:12px}
.step h3{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--navy)}
.stepn{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;background:var(--navy);color:#fff;font-size:12px;letter-spacing:0}
.opt{font-weight:700;letter-spacing:.08em;color:var(--muted);text-transform:lowercase}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.choice{display:flex;flex-direction:column;align-items:center;gap:2px;padding:16px 12px;border-radius:16px;border:1.5px solid var(--sky);background:transparent;color:var(--navy)}
.choice b{font-size:20px}
.choice span{font-size:13px;font-weight:600;color:var(--muted)}
.choice.yes[aria-pressed=true]{background:var(--blue);border-color:var(--blue);color:#fff}
.choice.no[aria-pressed=true]{background:var(--navy);border-color:var(--navy);color:#fff}
.choice[aria-pressed=true] span{color:rgba(255,255,255,.8)}
.givers{display:flex;flex-direction:column;gap:6px}
.nextbox{display:flex;flex-direction:column;align-items:center;gap:10px}
.nextbox .btn-main{width:100%;max-width:420px}
.tally{font-size:15px;color:var(--muted)}
.tally b{color:var(--navy);font-size:18px}
.scores-mini{opacity:.8;margin-top:6px}
.scores-mini .team .pts{font-size:22px}

/* Scoreboard in the top-right corner */
header.top{flex-wrap:nowrap;align-items:flex-start}
.hdr-right{flex-wrap:wrap;justify-content:flex-end}
.hud{display:flex;gap:16px;margin-right:10px;align-items:flex-start}
.hp{display:grid;grid-template-columns:auto auto;column-gap:8px;align-items:baseline;padding:2px 0 2px 10px;border-left:3px solid transparent;opacity:.75}
.hp.on{border-left-color:var(--c);opacity:1}
.hn{font-size:13px;font-weight:700;color:var(--navy);max-width:10ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hs{font-size:22px;font-weight:800;color:var(--c);font-variant-numeric:tabular-nums;line-height:1}
.hb{grid-column:1/-1;font-size:11px;font-weight:600;color:var(--muted)}
@media (max-width:700px){header.top{flex-wrap:wrap}.hud{order:3;width:100%;margin:8px 0 0;justify-content:flex-end}}

.hround{display:flex;flex-direction:column;align-items:flex-end;padding-right:14px;margin-right:2px;border-right:1px solid var(--mist)}
.hround span{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.hround b{font-size:22px;font-weight:800;color:var(--navy);line-height:1;font-variant-numeric:tabular-nums}
.hround small{font-size:13px;font-weight:700;color:var(--muted)}
.hround{border-right:0}
.hp,.hp.on{border-left:0;padding-left:0}
.hp{opacity:.6}.hp.on{opacity:1}

/* ===== Responsive header: logo · scores · buttons ===== */
header.top{display:grid;grid-template-columns:auto 1fr auto;align-items:center;column-gap:16px;row-gap:12px;flex-wrap:initial}
.logo{white-space:nowrap}
.hud{justify-self:end;display:grid;grid-template-columns:auto repeat(var(--n,2),auto);column-gap:18px;align-items:start;margin:0}
.hdr-right{flex-wrap:nowrap;justify-content:flex-end;gap:8px}
.tbtn{display:inline-flex;align-items:center;gap:6px}
.tbtn .slash{display:none}
.tbtn.off .slash{display:block}
.tbtn.off .wave{display:none}
.tbtn.off{color:var(--muted)}
.hp{min-width:0}

const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const multi=()=>state.players.length>1;

function pointsFor(sec){let p=0;TIERS.forEach(t=>{if(sec>=t.s)p=t.p;});return p;}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a}

/* ---------- Remember seen quotes on this device ---------- */
function loadSeen(){try{return new Set(JSON.parse(localStorage.getItem(SEEN_KEY)||"[]"));}catch(e){return new Set();}}
function saveSeen(){try{localStorage.setItem(SEEN_KEY,JSON.stringify([...seen]));}catch(e){}}
let seen=loadSeen();
function markSeen(item){
  seen.add(item.q);
  if(QUOTES.every(x=>seen.has(x.q))){ seen=new Set(state.used.map(id=>QUOTES[id].q)); } // everything seen: start a new cycle
  saveSeen();
}

/* ---------- Crystal ball offer ---------- */
function drawOffer(avoid){
  avoid=avoid||[];
  const pool=QUOTES.filter(x=>!state.used.includes(x.id));
  const fresh=shuffle(pool.filter(x=>!seen.has(x.q)&&!avoid.includes(x.id)));
  const stale=shuffle(pool.filter(x=>seen.has(x.q)&&!avoid.includes(x.id)));
  const back=shuffle(pool.filter(x=>avoid.includes(x.id)));
  const ordered=fresh.concat(stale,back), pick=[], names=new Set();
  for(const x of ordered){ if(pick.length>=8) break; if(!names.has(x.who)){pick.push(x);names.add(x.who);} }
  for(const x of ordered){ if(pick.length>=8) break; if(!pick.includes(x)) pick.push(x); }
  state.offer=pick.map(x=>x.id);
}

/* ---------- Render ---------- */
function render(){
  document.body.dataset.phase=state.phase;
  stopBalls();
  if(state.phase!=="choose") humStop();
  if(state.phase!=="choose" && !(state.phase==="talk"&&state.talk&&state.talk.running)) musicStop();
  gameVideo(["talk","judge"].includes(state.phase));
  if(!["talk"].includes(state.phase) && canSpeak()){ try{speechSynthesis.cancel();}catch(e){} }
  updateHud();
  ({intro:renderIntro,choose:renderChoose,talk:renderTalk,judge:renderJudge,final:renderFinal})[state.phase]();
}

function updateHud(){
  const h=document.getElementById("hud");
  const on=["choose","talk","judge"].includes(state.phase)&&state.players&&state.players[0]&&state.players[0].talk!==undefined;
  h.hidden=!on; if(!on){h.innerHTML="";return;}
  const s=speaker();
  h.style.setProperty("--n",state.players.length); h.dataset.n=state.players.length; h.innerHTML=`<div class="hround"><span>Round</span><b>${roundNo()}<small>/${ROUNDS}</small></b></div>`+state.players.map((p,i)=>`<div class="hp ${i===s?"on":""}" style="--c:${COLORS[i]}">
    <span class="hn">${esc(p.name)}</span><span class="hs">${total(p)}</span>
    ${multi()?`<span class="hb" title="Bonus points left to give">${p.left} to give</span>`:""}
  </div>`).join("");
}
function scoreBar(active){
  return `<div class="scorebar">${state.players.map((p,i)=>`<div class="team ${active===i?"active":""}" style="--c:${COLORS[i]}">
    <div class="nm"><span>${esc(p.name)}</span>${active===i?'<span class="turn">Up now</span>':""}</div>
    <div class="pts">${total(p)}</div>
    ${multi()?`<div class="stash">Bonus to give: ${p.left}</div>`:""}

}

function startGame(){
  const m=state.players.length>1;
  state.players=state.players.map((p,i)=>({name:(p.name||"").trim()||`Player ${i+1}`,talk:0,recv:0,left:m?BONUS_POOL:0}));
  state.round=0; state.used=[]; state.refreshUsed=false;
  drawOffer(); state.phase="choose"; render();
}

  app.querySelectorAll("[data-pick]").forEach(b=>b.onclick=()=>{
    if(caught) return; caught=true; stopBalls();
    musicStop(); sfx.catch();
    b.classList.add("caught"); app.querySelectorAll(".ball").forEach(o=>{if(o!==b)o.classList.add("fade");});

      state.item=item; state.used.push(item.id); markSeen(item);
      state.talk={running:false,elapsed:0,pts:0};
      state.phase="talk"; revealQuestion(); render();
    },matchMedia("(prefers-reduced-motion: reduce)").matches?50:750);
  });
  caught=false; startBalls(); musicStart();
}

/* ---------- Quote card ---------- */
/* The whole quote is laid out from the first letter (the untyped part is invisible),
   so each letter is typed straight into its final, centred position and nothing jumps. */
function qMarkup(q,i){
  if(i>=q.length) return "“"+esc(q)+"”";
  return "“"+esc(q.slice(0,i))+'<span class="caret"></span><span class="untyped">'+esc(q.slice(i))+"”</span>";
}
function qHeader(){
  const q=state.item.q, s=speaker();
  const shown=qMarkup(q,typing&&typing.q===q?typing.i:q.length);
  return `<div class="qcard">
    <div class="qtop"><span class="qtopic">${esc(state.item.who)}</span>
      ${canSpeak()?`<button class="qbtn" id="replay" aria-label="Read the quote aloud" title="Read the quote aloud"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>`:""}</div>
    <div class="eyebrow">${esc(state.players[s].name)}’s turn</div>
    <h2 id="qtext" aria-label="${esc(q)}">${shown}</h2>
  </div>`;
}

/* ---------- TALK ---------- */
const FLIP=TIERS[0].s;                       // the sand runs out in this many seconds, then the glass flips
const FLIPS=Math.ceil(MAX_TALK/FLIP);        // 3 runs of sand = 30 seconds
const HG_FLIP_MS=500;                        // how long the flip takes
const HG_GLASS="M26 14H94C94 50 66 62 66 80C66 98 94 110 94 146H26C26 110 54 98 54 80C54 62 26 50 26 14Z";
function hgFrac(elapsed){
  const c=Math.min(Math.floor(elapsed/FLIP),FLIPS-1), lead=c>0?HG_FLIP_MS/1000:0;
  return Math.max(0,Math.min(1,(elapsed-c*FLIP-lead)/(FLIP-lead)));
}
function hgLevels(fr){ const top=22+fr*58, bot=146-fr*58; return {top,bot}; }
function hourglassSVG(){
  const fr=hgFrac(state.talk.elapsed), L=hgLevels(fr), run=state.talk.running&&fr>0&&fr<1;
  return `<svg viewBox="0 0 120 160" aria-hidden="true"><defs><clipPath id="hgclip"><path d="${HG_GLASS}"/></clipPath></defs>
    <g id="hgSpin"><path class="hg-glass" d="${HG_GLASS}"/>
      <g clip-path="url(#hgclip)"><rect class="hg-sand" id="hgTop" x="0" width="120" y="${L.top}" height="${80-L.top}"/>
        <rect class="hg-sand" id="hgBot" x="0" width="120" y="${L.bot}" height="${146-L.bot}"/>
        <rect class="hg-sand" id="hgStream" x="58.6" width="2.8" y="78" height="${L.bot-78}" ${run?"":'visibility="hidden"'}/></g>
      <rect class="hg-cap" x="18" y="5" width="84" height="9" rx="3"/><rect class="hg-cap" x="18" y="146" width="84" height="9" rx="3"/></g></svg>`;
}
function hgPaint(fr,running){
  const top=document.getElementById("hgTop"), bot=document.getElementById("hgBot"), st=document.getElementById("hgStream"); if(!top||!bot||!st) return;
  const L=hgLevels(fr);
  top.setAttribute("y",L.top); top.setAttribute("height",80-L.top);
  bot.setAttribute("y",L.bot); bot.setAttribute("height",146-L.bot);

function tickTalk(){

function pickVoice(){
  if(!canSpeak()) return null;
  const vs=speechSynthesis.getVoices(); if(!vs.length) return null;
  const female=/(female|woman|karen|catherine|natasha|samantha|victoria|serena|moira|tessa|fiona|allison|ava|susan|zira|hazel|libby|sonia|aria|jenny|google uk english female|google us english)/i;
  const en=vs.filter(v=>/^en([-_]|$)/i.test(v.lang));
  return en.find(v=>/en[-_]AU/i.test(v.lang)&&female.test(v.name))||en.find(v=>/en[-_]GB/i.test(v.lang)&&female.test(v.name))||en.find(v=>female.test(v.name))||en[0]||vs[0];
}

}

function tone(f,t,dur,{type="sine",vol=.2,attack=.01,to=null,dest=null}={}){

}

  for(let i=0;i<n;i++) d[i]=Math.random()*2-1;
  const src=c.createBufferSource(), bp=c.createBiquadFilter(), g=c.createGain();
  src.buffer=buf; bp.type="bandpass"; bp.Q.value=q; bp.frequency.setValueAtTime(from,t); bp.frequency.exponentialRampToValueAtTime(to,t+dur);
  g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+dur*.4); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  src.connect(bp); bp.connect(g); g.connect(SFX.master); src.start(t); src.stop(t+dur);
}

    lp.frequency.cancelScheduledValues(t); lp.frequency.setValueAtTime(350,t); lp.frequency.linearRampToValueAtTime(1200,t+1.2);
    lp.frequency.setValueAtTime(1200,t+2.8); lp.frequency.linearRampToValueAtTime(300,t+3.5); };

    v.src=src; try{v.currentTime=0;}catch(e){}
  }
  v.loop=loop; v.muted=!(sound&&!state.sfxOff); v.hidden=false;
  const pl=v.play(); if(pl&&pl.catch) pl.catch(()=>{ v.muted=true; const p2=v.play(); if(p2&&p2.catch) p2.catch(()=>{}); });
}
function gameVideo(on){
  if(state.phase==="final") pageVideo(CELEBRATION_VIDEO,{sound:CELEBRATION_VIDEO_SOUND,loop:CELEBRATION_VIDEO_LOOP});
  else if(state.phase==="intro") pageVideo(INTRO_VIDEO);
  else pageVideo(on?GAME_VIDEO:null);
}

/* ---------- CRYSTAL BALL PHYSICS ---------- */
function stopBalls(){ if(rafId) cancelAnimationFrame(rafId); rafId=0; }
function startBalls(){
  stopBalls();
  const arena=document.getElementById("arena"); if(!arena) return;
  const els=[...arena.querySelectorAll(".ball")];
  const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  let W=arena.clientWidth, H=arena.clientHeight;
  const size=els[0]?els[0].offsetWidth:118;
  const cols=Math.min(els.length,Math.max(2,Math.floor(W/(size*1.15))));
  const balls=els.map((el,i)=>{
    const cx=((i%cols)+.5)*(W/cols), cy=(Math.floor(i/cols)+.5)*(H/Math.ceil(els.length/cols));
    const ang=Math.random()*Math.PI*2, sp=(reduce?0:1)*(95+Math.random()*70);
    return {el,x:Math.min(W-size,Math.max(0,cx-size/2)),y:Math.min(H-size,Math.max(0,cy-size/2)),vx:Math.cos(ang)*sp,vy:Math.sin(ang)*sp,wob:Math.random()*6};
  });
  const place=b=>{b.el.style.transform=`translate(${b.x}px,${b.y}px)`;};
  balls.forEach(place);
  if(reduce) return;
  let last=performance.now(); const t0=last;
  const step=now=>{
    const dt=Math.min(.05,(now-last)/1000); last=now;
    W=arena.clientWidth; H=arena.clientHeight;
    const boost=1+Math.min(.8,(now-t0)/20000);
    for(const b of balls){
      b.x+=b.vx*dt*boost; b.y+=b.vy*dt*boost+Math.sin((now/600)+b.wob)*0.25;
      if(b.x<0){b.x=0;b.vx=Math.abs(b.vx);} if(b.x>W-size){b.x=W-size;b.vx=-Math.abs(b.vx);}
      if(b.y<0){b.y=0;b.vy=Math.abs(b.vy);} if(b.y>H-size){b.y=H-size;b.vy=-Math.abs(b.vy);}
    }
    for(let i=0;i<balls.length;i++)for(let j=i+1;j<balls.length;j++){
      const a=balls[i],c=balls[j],dx=c.x-a.x,dy=c.y-a.y,d=Math.hypot(dx,dy);
      if(d>0&&d<size){const nx=dx/d,ny=dy/d,ov=(size-d)/2;a.x-=nx*ov;a.y-=ny*ov;c.x+=nx*ov;c.y+=ny*ov;
        const p=(a.vx-c.vx)*nx+(a.vy-c.vy)*ny; if(p>0){a.vx-=p*nx;a.vy-=p*ny;c.vx+=p*nx;c.vy+=p*ny;}}
    }
    balls.forEach(place);
    rafId=requestAnimationFrame(step);
  };
  rafId=requestAnimationFrame(step);
}

render();
})();
</script>
