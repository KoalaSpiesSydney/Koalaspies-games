<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Element Symbols – Periodic Table Matching Game | Modern English Australia</title>

<style>
:root {
  --bg:#e7e9ec;          /* brushed silver */
  --card:#e8f7f2;        /* unchanged: the square you liked */
  --face:#fdfdfd;        /* symbol cards */
  --accent:#a5673f;      /* copper */
  --accent-dark:#8a5333; /* copper, pressed */
  --ink:#1b1d20;         /* near black */
  --muted:#868c94;       /* grey */
  --line:#c3c9d0;        /* silver rule */
  --tile:#f4b6c2;        /* original tile accent - unchanged */
}

*, *::before, *::after { box-sizing:border-box; }

/* ===== Background Video ===== */
#bgVideo {
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  object-fit:cover;
  z-index:-1;
  opacity:0.35;
  pointer-events:none;
}

/* ===== Layout ===== */
html { -webkit-text-size-adjust:100%; }

body {
  margin:0;
  font-family:"Helvetica Neue", Helvetica, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  background:var(--bg);
  color:var(--ink);
  display:flex;
  flex-direction:column;
  align-items:center;
  min-height:100vh;
  min-height:100svh;
  overflow-x:hidden;
  padding-left:env(safe-area-inset-left);
  padding-right:env(safe-area-inset-right);
}

.topbar { width:100%; text-align:center; padding-top:.6rem; position:relative; }

.brand {
  font-weight:700;
  letter-spacing:2.5px;
  font-size:clamp(.68rem, 2.4vw, .9rem);
  color:var(--accent);
  text-transform:uppercase;
}

main {
  flex:1;
  display:flex;
  flex-direction:column;
  align-items:center;
  width:100%;
  padding:.5rem .6rem 1rem;
  text-align:center;
}

h1 {
  color:var(--ink);
  font-weight:600;
  letter-spacing:.5px;
  margin:.6rem 0 .3rem;
  font-size:clamp(1.05rem, 4.2vw, 1.75rem);
}

p.intro {
  max-width:640px;
  margin:.2rem auto .4rem;
  opacity:.9;
  font-size:clamp(.78rem, 2.6vw, 1rem);
  line-height:1.4;
}

#progress {
  font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  font-size:clamp(.64rem, 2.1vw, .8rem);
  color:var(--muted);
  letter-spacing:.6px;
  text-transform:uppercase;
}

#status {
  min-height:1.4em;
  margin-top:.7rem;
  color:var(--accent);
  font-weight:600;
  font-size:clamp(.82rem, 2.8vw, 1rem);
}

/* ===== 12-card board: 4 across, 3 down, always square ===== */
@supports (height:1svh) {
  #game { width:min(96vw, 640px, calc(56svh * 1.34)); }
}

#game {
  display:grid;
  grid-template-columns:repeat(4, 1fr);
  gap:clamp(5px, 1.4vw, 14px);
  width:min(96vw, 640px, calc(56vh * 1.34));
  margin:clamp(10px, 2vw, 20px) auto 0;
}

.card {
  aspect-ratio:1 / 1;
  background:var(--card);
  border:2px solid var(--tile);
  border-radius:clamp(7px, 1.6vw, 14px);
  padding:clamp(3px, 1.2vw, 10px);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  font-size:clamp(.6rem, 2.3vw, 1.05rem);
  line-height:1.18;
  text-align:center;
  min-width:0;                 /* a grid item will not shrink below its
                                  longest word without this */
  overflow-wrap:anywhere;      /* ...and this lets that word break */
  hyphens:none;
  user-select:none;
  -webkit-tap-highlight-color:transparent;
  transition:background .3s, color .3s;
}

/* Symbol cards stay face up */
.card.symbol {
  background:#ffffff;
  color:var(--ink);
  font-size:clamp(1.05rem, 5vw, 2.2rem);
  font-weight:700;
  letter-spacing:1px;
}

.card.symbol .z { max-width:100%; }

.card.symbol .z {
  font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  font-size:clamp(.5rem, 1.7vw, .78rem);
  font-weight:500;
  letter-spacing:.5px;
  color:var(--muted);
  line-height:1;
  margin-bottom:.15em;
}

.card.symbol.selected { background:var(--tile); color:#000; }
.card.symbol.selected .z { color:#000; }

.card.flipped { background:var(--tile); color:#000; }

.card.matched {
  background:#d1ffd1;
  color:#000;
  cursor:default;
}

.card.matched .z { color:#000; }

/* ===== Button ===== */
button.reset {
  margin-top:.9rem;
  padding:clamp(.55rem,2vw,.8rem) clamp(1rem,4vw,1.4rem);
  background:var(--accent);
  border:none;
  border-radius:6px;
  font-weight:600;
  cursor:pointer;
  color:#fff;
  letter-spacing:1.5px;
  text-transform:uppercase;
  font-size:clamp(.8rem, 2.8vw, 1rem);
  min-height:44px;
  transition:transform .06s ease, background .2s ease;
}

button.reset:hover { background:var(--accent-dark); transform:translateY(-1px); }
button.reset:active { transform:translateY(0); }

/* ===== Footer ===== */
footer {
  width:100%;
  text-align:center;
  background:var(--bg);
  color:var(--muted);
  padding:.8rem 0 calc(.8rem + env(safe-area-inset-bottom));
  border-top:1px solid var(--line);
  font-size:clamp(.68rem, 2.2vw, .9rem);
}

/* ===== QR code: top-left, tap to enlarge for a classroom =====
   The code is built at runtime from location.href, so it points at
   whatever address this page is really open at — nothing to configure
   when you move the file or publish the site. */
.qr-mini {
  position:absolute;
  top:.2rem;
  left:.6rem;
  width:38px;
  height:38px;
  padding:3px;
  background:#fff;
  border:1px solid var(--line);
  border-radius:7px;
  line-height:0;
  cursor:pointer;
  transition:transform .15s ease, border-color .15s ease;
}
.qr-mini:hover { transform:scale(1.08); border-color:var(--accent); }
.qr-mini img { width:100%; height:100%; display:block; }

.qr-overlay {
  position:fixed;
  inset:0;
  z-index:60;
  display:none;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:14px;
  padding:20px;
  text-align:center;
  background:rgba(27,29,32,.9);
}
.qr-overlay.open { display:flex; }
.qr-overlay img {
  width:min(58vmin,280px);
  height:min(58vmin,280px);
  background:#fff;
  padding:10px;
  border-radius:12px;
}
.qr-overlay p { margin:0; color:#f2f2f2; font-size:.85rem; max-width:34ch; line-height:1.5; }
.qr-overlay code { display:block; margin-top:4px; color:#e6c2a6; font-size:.72rem; word-break:break-all; }

@media (max-width:480px) {
  .qr-mini { width:32px; height:32px; left:.4rem; top:.15rem; }
}



/* ===== Phones held sideways =====
   Stacked, the board and the button cannot both fit in 390px of height,
   so the furniture moves to the left and the board takes the right.
   The board is 4 cards wide and 3 deep, hence the 4/3: its width is set
   from the height that is actually left over after the bar and footer. */
@media (max-height:520px) and (orientation:landscape) {
  main {
    display:grid;
    grid-template-columns:minmax(0, 1fr) auto;
    grid-template-areas:
      "title    board"
      "progress board"
      "status   board"
      "btn      board";
    align-content:center;
    justify-items:center;
    gap:.15rem clamp(10px, 2vw, 22px);
    padding:.4rem .7rem;
  }
  h1           { grid-area:title; font-size:1rem; margin:.2rem 0 .1rem; }
  p.intro      { display:none; }
  #progress    { grid-area:progress; }
  #status      { grid-area:status; margin-top:.35rem; }
  button.reset { grid-area:btn; margin-top:.45rem; }
  #game {
    grid-area:board;
    width:min(52vw, calc((100vh - 96px) * 4 / 3));
    margin:0;
  }
}
@supports (height:1svh) {
  @media (max-height:520px) and (orientation:landscape) {
    #game { width:min(52vw, calc((100svh - 96px) * 4 / 3)); }
  }
}
</style>
</head>

<body>

<!-- ===== Background Video ===== -->
<video id="bgVideo" autoplay muted loop playsinline>
  <source src="YOUR-VIDEO.mp4" type="video/mp4">
</video>

<div class="topbar" role="banner">
  <button class="qr-mini" id="qrMini" aria-label="Show a QR code for this game">
    <img id="qrMiniImg" alt="">
  </button>
  <div class="brand">Modern English Australia</div>
</div>

<main>
  <h1>Element Symbols – Periodic Table Matching Game</h1>
  <p class="intro">Choose a symbol, then turn over cards to find the element it stands for. Every round deals six new elements, so play again for a fresh set.</p>
  <div id="progress"></div>

  <div id="game"></div>
  <div id="status"></div>

  <button class="reset" onclick="startGame()">Play Again</button>
</main>

<footer>
  © 2025 KoalaSpiesSydney. All rights reserved.
</footer>

<div class="qr-overlay" id="qrOverlay">
  <img id="qrBigImg" alt="QR code for this game">
  <p>Scan to open this game on a phone.<code id="qrUrl"></code></p>
  <button class="reset" id="qrClose" style="margin-top:0">Close</button>
</div>

<script>
/* ===== Pairs dealt each round. 6 pairs = 12 cards = 4 across x 3 down.
   Change this to 8 for a 4 x 4 board of 16 cards.               ===== */
const PAIRS_PER_ROUND = 6;

/* ===== The whole periodic table: [atomic number, symbol, name] ===== */
const ELEMENTS = [
  [1,"H","Hydrogen"],[2,"He","Helium"],[3,"Li","Lithium"],[4,"Be","Beryllium"],
  [5,"B","Boron"],[6,"C","Carbon"],[7,"N","Nitrogen"],[8,"O","Oxygen"],
  [9,"F","Fluorine"],[10,"Ne","Neon"],[11,"Na","Sodium"],[12,"Mg","Magnesium"],
  [13,"Al","Aluminium"],[14,"Si","Silicon"],[15,"P","Phosphorus"],[16,"S","Sulfur"],
  [17,"Cl","Chlorine"],[18,"Ar","Argon"],[19,"K","Potassium"],[20,"Ca","Calcium"],
  [21,"Sc","Scandium"],[22,"Ti","Titanium"],[23,"V","Vanadium"],[24,"Cr","Chromium"],
  [25,"Mn","Manganese"],[26,"Fe","Iron"],[27,"Co","Cobalt"],[28,"Ni","Nickel"],
  [29,"Cu","Copper"],[30,"Zn","Zinc"],[31,"Ga","Gallium"],[32,"Ge","Germanium"],
  [33,"As","Arsenic"],[34,"Se","Selenium"],[35,"Br","Bromine"],[36,"Kr","Krypton"],
  [37,"Rb","Rubidium"],[38,"Sr","Strontium"],[39,"Y","Yttrium"],[40,"Zr","Zirconium"],
  [41,"Nb","Niobium"],[42,"Mo","Molybdenum"],[43,"Tc","Technetium"],[44,"Ru","Ruthenium"],
  [45,"Rh","Rhodium"],[46,"Pd","Palladium"],[47,"Ag","Silver"],[48,"Cd","Cadmium"],
  [49,"In","Indium"],[50,"Sn","Tin"],[51,"Sb","Antimony"],[52,"Te","Tellurium"],
  [53,"I","Iodine"],[54,"Xe","Xenon"],[55,"Cs","Caesium"],[56,"Ba","Barium"],
  [57,"La","Lanthanum"],[58,"Ce","Cerium"],[59,"Pr","Praseodymium"],[60,"Nd","Neodymium"],
  [61,"Pm","Promethium"],[62,"Sm","Samarium"],[63,"Eu","Europium"],[64,"Gd","Gadolinium"],
  [65,"Tb","Terbium"],[66,"Dy","Dysprosium"],[67,"Ho","Holmium"],[68,"Er","Erbium"],
  [69,"Tm","Thulium"],[70,"Yb","Ytterbium"],[71,"Lu","Lutetium"],[72,"Hf","Hafnium"],
  [73,"Ta","Tantalum"],[74,"W","Tungsten"],[75,"Re","Rhenium"],[76,"Os","Osmium"],
  [77,"Ir","Iridium"],[78,"Pt","Platinum"],[79,"Au","Gold"],[80,"Hg","Mercury"],
  [81,"Tl","Thallium"],[82,"Pb","Lead"],[83,"Bi","Bismuth"],[84,"Po","Polonium"],
  [85,"At","Astatine"],[86,"Rn","Radon"],[87,"Fr","Francium"],[88,"Ra","Radium"],
  [89,"Ac","Actinium"],[90,"Th","Thorium"],[91,"Pa","Protactinium"],[92,"U","Uranium"],
  [93,"Np","Neptunium"],[94,"Pu","Plutonium"],[95,"Am","Americium"],[96,"Cm","Curium"],
  [97,"Bk","Berkelium"],[98,"Cf","Californium"],[99,"Es","Einsteinium"],[100,"Fm","Fermium"],
  [101,"Md","Mendelevium"],[102,"No","Nobelium"],[103,"Lr","Lawrencium"],[104,"Rf","Rutherfordium"],
  [105,"Db","Dubnium"],[106,"Sg","Seaborgium"],[107,"Bh","Bohrium"],[108,"Hs","Hassium"],
  [109,"Mt","Meitnerium"],[110,"Ds","Darmstadtium"],[111,"Rg","Roentgenium"],[112,"Cn","Copernicium"],
  [113,"Nh","Nihonium"],[114,"Fl","Flerovium"],[115,"Mc","Moscovium"],[116,"Lv","Livermorium"],
  [117,"Ts","Tennessine"],[118,"Og","Oganesson"]
];

const matchColors = [
  "#ffd166","#06d6a0","#4cc9f0","#f72585","#ffb703",
  "#90be6d","#f28482","#43aa8b","#577590","#ff9f1c",
  "#b5179e","#00b4d8"
];

let selectedSymbol, revealedWord, lock, matchedCount, colorMap, roundPairs;
let deck = [];              /* elements not yet dealt this cycle */
let seen = new Set();       /* symbols covered so far this cycle */
let round = 0;

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/* Deal the next set of elements, never repeating one until the
   whole table has been played, then start a fresh cycle. */
function dealRound() {
  if (seen.size >= ELEMENTS.length) {
    seen = new Set();
    deck = [];
  }
  const picked = [];
  while (picked.length < PAIRS_PER_ROUND) {
    if (!deck.length) {
      deck = shuffle(ELEMENTS.filter(e => !picked.includes(e) && !seen.has(e[1])));
      if (!deck.length) deck = shuffle(ELEMENTS.filter(e => !picked.includes(e)));
    }
    const el = deck.shift();
    picked.push(el);
    seen.add(el[1]);
  }
  return picked;
}

function startGame() {
  const game = document.getElementById("game");
  const status = document.getElementById("status");
  const progress = document.getElementById("progress");
  game.innerHTML = "";
  status.textContent = "";

  selectedSymbol = null;
  revealedWord = null;
  lock = false;
  matchedCount = 0;
  colorMap = {};
  round++;

  roundPairs = dealRound();

  progress.textContent =
    "Round " + round + "  ·  " + seen.size + " of " + ELEMENTS.length + " elements covered";

  let cards = roundPairs.flatMap(([z, symbol, element]) => [
    { text: symbol, pair: symbol, type: "symbol", z: z },
    { text: element, pair: symbol, type: "word" }
  ]);

  cards = shuffle(cards);

  cards.forEach(data => {
    const div = document.createElement("div");
    div.classList.add("card", data.type);
    div.dataset.pair = data.pair;
    div.dataset.text = data.text;

    /* Symbols are shown from the start; words stay blank until turned. */
    if (data.type === "symbol") {
      const z = document.createElement("span");
      z.className = "z";
      z.textContent = data.z;
      const s = document.createElement("span");
      s.textContent = data.text;
      div.append(z, s);
    }

    game.appendChild(div);

    div.addEventListener("click", () => {
      if (lock || div.classList.contains("matched")) return;

      if (data.type === "symbol") {
        if (selectedSymbol === div) {
          div.classList.remove("selected");
          selectedSymbol = null;
          return;
        }
        if (selectedSymbol) selectedSymbol.classList.remove("selected");
        selectedSymbol = div;
        div.classList.add("selected");
      } else {
        if (div.classList.contains("flipped")) return;
        if (revealedWord) {
          revealedWord.classList.remove("flipped");
          revealedWord.textContent = "";
        }
        div.classList.add("flipped");
        div.textContent = data.text;
        revealedWord = div;
      }

      if (selectedSymbol && revealedWord) checkPair(status);
    });
  });
}

function checkPair(status) {
  lock = true;
  const symbol = selectedSymbol;
  const word = revealedWord;

  setTimeout(() => {
    if (symbol.dataset.pair === word.dataset.pair) {
      if (!colorMap[symbol.dataset.pair]) {
        const used = Object.keys(colorMap).length;
        colorMap[symbol.dataset.pair] = matchColors[used % matchColors.length];
      }
      const c = colorMap[symbol.dataset.pair];

      [symbol, word].forEach(card => {
        card.classList.remove("flipped", "selected");
        card.classList.add("matched");
        card.style.background = c;
      });

      matchedCount++;
      if (matchedCount === roundPairs.length) {
        status.textContent = seen.size >= ELEMENTS.length
          ? "Brilliant. That is the whole periodic table."
          : "Brilliant. All matched — play again for six new elements.";
      }
    } else {
      symbol.classList.remove("selected");
      word.classList.remove("flipped");
      word.textContent = "";
    }

    selectedSymbol = null;
    revealedWord = null;
    lock = false;
  }, 800);
}

/* ===== QR code for this page =====
   Reads location.href at runtime, so it picks up your real domain once the
   file is on the server. Tap it to enlarge: a 38px code will not scan from
   the back of a room. */
(function () {
  const mini = document.getElementById("qrMini");
  if (!mini) return;
  const api = "https://api.qrserver.com/v1/create-qr-code/?data=" +
              encodeURIComponent(location.href) + "&size=";
  document.getElementById("qrMiniImg").src = api + "120x120";
  document.getElementById("qrBigImg").src  = api + "400x400";
  document.getElementById("qrUrl").textContent = location.href;

  const box = document.getElementById("qrOverlay");
  mini.addEventListener("click", () => box.classList.add("open"));
  document.getElementById("qrClose").addEventListener("click", () => box.classList.remove("open"));
  box.addEventListener("click", e => { if (e.target === box) box.classList.remove("open"); });
  document.addEventListener("keydown", e => {
    if (e.key === "Escape") box.classList.remove("open");
  });
})();

startGame();
</script>

</body>
</html>
